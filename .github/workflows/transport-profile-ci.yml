name: transport-profile-ci

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n setup_node.sh
          bash -n setup_node_next.sh
          bash -n production/remnawave-transport-manager.sh
          bash -n production/xhttp-signature-manager.sh
          bash -n production/rkn-watcher-manager.sh
          bash -n production/validate-generated-profile.sh

      - name: Install pinned Xray v26.7.28
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip \
            -o /tmp/xray.zip
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/xray.zip' | sha256sum -c -
          unzip -q /tmp/xray.zip -d /tmp/xray-bin
          sudo install -m 0755 /tmp/xray-bin/xray /usr/local/bin/xray
          sudo install -m 0644 /tmp/xray-bin/geoip.dat /usr/local/bin/geoip.dat
          sudo install -m 0644 /tmp/xray-bin/geosite.dat /usr/local/bin/geosite.dat
          xray version

      - name: Generate and validate XHTTP external-SNI profile
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/certs"
          chmod 755 "$T" "$T/certs"
          printf 'node.example.com\n' > "$T/.node_domain"
          printf 'www.microsoft.com\n' > "$T/.reality_sni"
          printf 'www.microsoft.com:443\n' > "$T/.reality_target"
          chmod 644 "$T/.node_domain" "$T/.reality_sni" "$T/.reality_target"

          sudo env PATH="$PATH" APP_DIR="$T" CAMOUFLAGE_MODE=external SNI_MODE=keep bash production/remnawave-transport-manager.sh xhttp >/tmp/xhttp.out
          sudo env APP_DIR="$T" bash production/xhttp-signature-manager.sh >/tmp/xhttp-signature.out

          sudo jq empty "$T/remnawave-profiles/xhttp-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.network == "xhttp"' "$T/remnawave-profiles/xhttp-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.security == "reality"' "$T/remnawave-profiles/xhttp-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.realitySettings.target == "www.microsoft.com:443"' "$T/remnawave-profiles/xhttp-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.xhttpSettings.extra.sessionIDTable == "Base62"' "$T/remnawave-profiles/xhttp-reality.json"
          sudo jq -e --slurpfile e "$T/remnawave-profiles/host-xhttp-extra.json" '.inbounds[0].streamSettings.xhttpSettings.extra == $e[0]' "$T/remnawave-profiles/xhttp-reality.json"
          sudo xray run -test -c "$T/remnawave-profiles/xhttp-reality.json"

      - name: Generate and validate RAW SelfSteal profile
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/certs"
          chmod 755 "$T" "$T/certs"
          printf 'node.example.com\n' > "$T/.node_domain"
          printf 'dummy-cert\n' > "$T/certs/fullchain.pem"
          printf 'dummy-key\n' > "$T/certs/privkey.pem"
          chmod 644 "$T/.node_domain" "$T/certs/fullchain.pem" "$T/certs/privkey.pem"

          sudo env PATH="$PATH" APP_DIR="$T" CAMOUFLAGE_MODE=selfsteal bash production/remnawave-transport-manager.sh raw >/tmp/raw.out
          sudo jq empty "$T/remnawave-profiles/raw-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.network == "raw"' "$T/remnawave-profiles/raw-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.security == "reality"' "$T/remnawave-profiles/raw-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.realitySettings.target == "/dev/shm/nginx.sock"' "$T/remnawave-profiles/raw-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.realitySettings.xver == 1' "$T/remnawave-profiles/raw-reality.json"
          sudo jq -e '.inbounds[0].streamSettings.realitySettings.serverNames == ["node.example.com"]' "$T/remnawave-profiles/raw-reality.json"
          sudo grep -q '^Flow: пусто$' "$T/remnawave-profiles/host-raw.txt"
          sudo xray run -test -c "$T/remnawave-profiles/raw-reality.json"

      - name: Generate and validate Hysteria2 profile
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/certs" "$T/www"
          chmod 755 "$T" "$T/certs" "$T/www"
          printf 'node.example.com\n' > "$T/.node_domain"
          printf '<html><body>selfsteal</body></html>\n' > "$T/www/index.html"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=node.example.com' \
            -keyout "$T/certs/privkey.pem" -out "$T/certs/fullchain.pem" >/dev/null 2>&1
          sudo mkdir -p /etc/xray/certs
          sudo cp "$T/certs/fullchain.pem" /etc/xray/certs/fullchain.pem
          sudo cp "$T/certs/privkey.pem" /etc/xray/certs/privkey.pem
          chmod 644 "$T/.node_domain" "$T/certs/fullchain.pem" "$T/www/index.html"

          sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/remnawave-transport-manager.sh hysteria >/tmp/hysteria.out
          sudo jq empty "$T/remnawave-profiles/hysteria2-tls.json"
          sudo jq -e '.inbounds[0].protocol == "hysteria"' "$T/remnawave-profiles/hysteria2-tls.json"
          sudo jq -e '.inbounds[0].streamSettings.security == "tls"' "$T/remnawave-profiles/hysteria2-tls.json"
          sudo jq -e '.inbounds[0].streamSettings.hysteriaSettings.masquerade.type == "string"' "$T/remnawave-profiles/hysteria2-tls.json"
          sudo xray run -test -c "$T/remnawave-profiles/hysteria2-tls.json"
