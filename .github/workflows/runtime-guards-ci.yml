name: runtime-guards-ci

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
      - custom
  pull_request:
    branches:
      - custom

jobs:
  production-audit-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax immutable manifest and wrapper pins
        run: |
          set -euo pipefail
          bash -n setup_node_next.sh
          bash -n production/next-runtime-guards.sh
          bash -n production/network-tuning-manager.sh
          bash -n production/selfsteal-site-manager.sh
          sha256sum -c production/modules.sha256
          python3 - <<'PY'
          from pathlib import Path
          p=Path('production/modules.sha256')
          assert p.read_bytes().endswith(b'\n'), 'modules.sha256 must end with newline'
          assert len([x for x in p.read_text().splitlines() if x.strip()]) == 7
          PY
          grep -Eq '^LEGACY_TEMPLATES_REF="[0-9a-f]{40}"$' setup_node_next.sh
          grep -q '\[production/next-runtime-guards.sh\]' setup_node_next.sh
          grep -q 'setup-remna-node/${LEGACY_COMMIT}/vendor/telemt-install' setup_node_next.sh
          grep -q 'minClientVer: допустим формат' setup_node_next.sh
          ! grep -q 'patch-selfsteal' <(sed -n '/prepare_selfsteal_manager(){/,/^}/p' setup_node_next.sh)

      - name: Patch real pinned RKN and verify hardened SelfSteal directly
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          cp production/rkn-watcher-manager.sh "$T/rkn.sh"
          sudo env APP_DIR="$T/app" bash production/next-runtime-guards.sh patch-rkn "$T/rkn.sh"
          bash -n "$T/rkn.sh"
          bash -n production/selfsteal-site-manager.sh
          grep -q 'validate_scanner_set' "$T/rkn.sh"
          grep -q 'last-good-tspu.ipset' "$T/rkn.sh"
          grep -q '.safe-update-running' "$T/rkn.sh"
          grep -q 'guard disabled until manual recovery' "$T/rkn.sh"
          grep -q "local selected='random' template" production/selfsteal-site-manager.sh
          grep -q '/data/streams.json' production/selfsteal-site-manager.sh
          grep -q '.uniquify-manifest.txt' production/selfsteal-site-manager.sh
          echo 'Patched RKN SHA256:'
          sha256sum "$T/rkn.sh"

          python3 - "$T/rkn.sh" "$T/guard.sh" "$T/update.sh" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          guard=s.split("cat > \"$GUARD_SCRIPT\" <<'EOF_GUARD'\n",1)[1].split('\nEOF_GUARD',1)[0]
          update=s.split('cat > "$SAFE_UPDATE_SCRIPT" <<EOF_UPDATE_SCRIPT\n',1)[1].split('\nEOF_UPDATE_SCRIPT',1)[0]
          Path(sys.argv[2]).write_text(guard+'\n')
          Path(sys.argv[3]).write_text(update+'\n')
          PY
          bash -n "$T/guard.sh"
          bash -n "$T/update.sh"
          grep -q '.safe-update-running' "$T/update.sh"
          grep -q 'rm -f .*scanner-guard-active' "$T/update.sh"

      - name: RKN rejects dangerous scanner networks before touching iptables
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          cp production/rkn-watcher-manager.sh "$T/rkn.sh"
          sudo env APP_DIR="$T/app" bash production/next-runtime-guards.sh patch-rkn "$T/rkn.sh"
          python3 - "$T/rkn.sh" "$T/guard.sh" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          guard=s.split("cat > \"$GUARD_SCRIPT\" <<'EOF_GUARD'\n",1)[1].split('\nEOF_GUARD',1)[0]
          Path(sys.argv[2]).write_text(guard+'\n')
          PY
          chmod +x "$T/guard.sh"
          mkdir -p "$T/bin"
          cat > "$T/bin/ipset" <<'SH'
          #!/usr/bin/env bash
          case "${1:-}" in
            list)
              echo 'Name: TSPUIPS'
              echo 'Number of entries: 1'
              echo 'Members:'
              [[ "${MOCK_IPSET_MODE:-wide}" == valid ]] && echo '5.6.7.0/24' || echo '0.0.0.0/0'
              ;;
            save)
              echo 'create TSPUIPS hash:net family inet'
              [[ "${MOCK_IPSET_MODE:-wide}" == valid ]] && echo 'add TSPUIPS 5.6.7.0/24' || echo 'add TSPUIPS 0.0.0.0/0'
              ;;
            *) exit 0 ;;
          esac
          SH
          cat > "$T/bin/iptables" <<'SH'
          #!/usr/bin/env bash
          echo "$*" >> "${IPTABLES_LOG:?}"
          exit 0
          SH
          chmod +x "$T/bin/ipset" "$T/bin/iptables"
          : > "$T/iptables.log"
          if sudo env PATH="$T/bin:$PATH" IPTABLES_LOG="$T/iptables.log" bash "$T/guard.sh" validate; then exit 1; fi
          if sudo env PATH="$T/bin:$PATH" IPTABLES_LOG="$T/iptables.log" bash "$T/guard.sh" apply; then exit 1; fi
          test ! -s "$T/iptables.log"
          sudo env PATH="$T/bin:$PATH" IPTABLES_LOG="$T/iptables.log" MOCK_IPSET_MODE=valid bash "$T/guard.sh" validate

      - name: Hysteria cert bind restore follows profile not transport state
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/app/certs" "$T/app/remnawave-profiles" "$T/bin"
          printf 'xhttp\n' > "$T/app/.transport"
          printf '{}\n' > "$T/app/remnawave-profiles/hysteria2-tls.json"
          printf 'cert\n' > "$T/app/certs/fullchain.pem"
          printf 'key\n' > "$T/app/certs/privkey.pem"
          cat > "$T/app/docker-compose.yml" <<'YAML'
          services:
            remnanode:
              image: example/remnanode:latest
              volumes:
                - /dev/shm:/dev/shm:rw
          YAML
          cat > "$T/bin/docker" <<'SH'
          #!/usr/bin/env bash
          if [[ "${1:-}" == ps ]]; then echo remnanode; exit 0; fi
          if [[ "${1:-}" == exec ]]; then [[ -f "${MOCK_STATE:?}" ]]; exit $?; fi
          if [[ "${1:-}" == compose ]]; then touch "${MOCK_STATE:?}"; exit 0; fi
          exit 0
          SH
          chmod +x "$T/bin/docker"
          sudo env PATH="$T/bin:$PATH" MOCK_STATE="$T/mounted" APP_DIR="$T/app" bash production/next-runtime-guards.sh restore-hysteria
          sudo grep -Fq "$T/app/certs:/etc/xray/certs:ro" "$T/app/docker-compose.yml"
          sudo test -f "$T/mounted"
          ! sudo find "$T/app" -maxdepth 1 -name 'docker-compose.yml.bak.hysteria-restore.*' -print -quit | grep -q .

      - name: H3 NORMAL network profile never drops below July baseline
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          sed '/^case "${1:-apply}" in/,$d' production/network-tuning-manager.sh > "$T/network-lib.sh"
          CONF="$T/99-remnanode.conf"; LIMITS="$T/99-remnanode-limits.conf"
          source "$T/network-lib.sh"
          write_config NORMAL bbr
          getv(){ awk -F' = ' -v key="$1" '$1==key {print $2}' "$CONF"; }
          test "$(getv net.netfilter.nf_conntrack_max)" -ge 1048576
          test "$(getv net.core.somaxconn)" -ge 32768
          test "$(getv net.core.netdev_max_backlog)" -ge 16384
          test "$(getv net.core.rmem_max)" -ge 67108864
          test "$(getv net.core.wmem_max)" -ge 67108864
          test "$(getv net.ipv4.tcp_max_syn_backlog)" -ge 16384
          test "$(getv fs.file-max)" -ge 2097152
          test "$(getv fs.inotify.max_user_instances)" -ge 8192
          test "$(getv fs.inotify.max_user_watches)" -ge 1048576
          test "$(getv net.ipv4.conf.all.rp_filter)" -eq 2
          test "$(getv net.ipv4.conf.default.rp_filter)" -eq 2

      - name: H4 pinned template is truly unique and leaks no manifest
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          grep -q "local selected='random' template" production/selfsteal-site-manager.sh
          grep -q 'APP_DIR="$APP_DIR" bash "$f" random' setup_node_next.sh
          sudo env APP_DIR="$T/node-a" WWW_DIR="$T/www-a" bash production/selfsteal-site-manager.sh template endless-verify
          sudo env APP_DIR="$T/node-b" WWW_DIR="$T/www-b" bash production/selfsteal-site-manager.sh template endless-verify
          sudo grep -qx 'template:endless-verify' "$T/node-a/.selfsteal_site"
          A="$(sudo sha256sum "$T/www-a/index.html" | awk '{print $1}')"
          B="$(sudo sha256sum "$T/www-b/index.html" | awk '{print $1}')"
          test "$A" != "$B"
          ! sudo find "$T/www-a" -name '.uniquify-manifest.txt' -print -quit | grep -q .
          ! sudo find "$T/www-a" \( -name 'README.md' -o -name 'README.MD' \) -print -quit | grep -q .

      - name: Legacy adaptation pins templates Telemt and removes bypass command
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          sed '/^main "\$@"$/d' setup_node_next.sh > "$T/setup-lib.sh"
          source "$T/setup-lib.sh"
          curl -fsSL --proto '=https' "https://raw.githubusercontent.com/evgmahov-blip/setup-remna-node/${LEGACY_COMMIT}/setup_node.sh" -o "$T/legacy.sh"
          echo "$LEGACY_SHA256  $T/legacy.sh" | sha256sum -c -
          prepare_legacy_for_next "$T/legacy.sh"
          bash -n "$T/legacy.sh"
          ! grep -q 'node-templates/archive/refs/heads/main.zip' "$T/legacy.sh"
          grep -q "node-templates/archive/${LEGACY_TEMPLATES_REF}.zip" "$T/legacy.sh"
          grep -q "node-templates-${LEGACY_TEMPLATES_REF}" "$T/legacy.sh"
          ! grep -q '^    register_globally$' "$T/legacy.sh"
          ! grep -q 'setup-remna-node/custom/vendor/telemt-install' "$T/legacy.sh"
          grep -q "setup-remna-node/${LEGACY_COMMIT}/vendor/telemt-install" "$T/legacy.sh"
          grep -q 'local protocol="reality"' "$T/legacy.sh"

      - name: Uninstall cleanup cannot leave RKN guard or persistent units
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          sed '/^main "\$@"$/d' setup_node_next.sh > "$T/setup-lib.sh"
          source "$T/setup-lib.sh"
          LOG="$T/log"; STATE="$T/ipt-state"
          : > "$LOG"; printf '1\n' > "$STATE"
          systemctl(){ { printf 'systemctl'; printf ' %s' "$@"; printf '\n'; } >> "$LOG"; return 0; }
          rm(){ { printf 'rm'; printf ' %s' "$@"; printf '\n'; } >> "$LOG"; return 0; }
          iptables(){
            case "$1" in
              -C) test "$(cat "$STATE")" = 1 ;;
              -D) printf '0\n' > "$STATE"; { printf 'iptables'; printf ' %s' "$@"; printf '\n'; } >> "$LOG"; return 0 ;;
              -F|-X) { printf 'iptables'; printf ' %s' "$@"; printf '\n'; } >> "$LOG"; return 0 ;;
              *) return 0 ;;
            esac
          }
          cleanup_rkn_watch_after_uninstall
          cat "$LOG"
          test "$(cat "$STATE")" = 0
          grep -q 'remnanode-rkn-scanner-update.timer' "$LOG"
          grep -q 'remnanode-rkn-scanner-boot.service' "$LOG"
          grep -q 'iptables -D INPUT -j REMNA_RKN_SCANNERS' "$LOG"
          grep -q 'iptables -X REMNA_RKN_SCANNERS' "$LOG"

      - name: Legacy post-actions follow compose state
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          sed '/^main "\$@"$/d' setup_node_next.sh > "$T/setup-lib.sh"
          source "$T/setup-lib.sh"
          APP_DIR="$T/app"; WORK_DIR="$T/work"; mkdir -p "$APP_DIR" "$WORK_DIR"
          LOG="$T/log"
          fetch_url(){ printf '#!/usr/bin/env bash\n%s\n' "${FAKE_LEGACY_ACTION:-:}" > "$2"; chmod +x "$2"; }
          prepare_legacy_for_next(){ :; }
          remove_legacy_global_command(){ echo remove-global >> "$LOG"; }
          cleanup_rkn_watch_after_uninstall(){ echo cleanup >> "$LOG"; }
          restore_rkn_guard(){ echo restore-rkn >> "$LOG"; }
          sync_rkn_watch(){ echo sync-rkn >> "$LOG"; }
          run_selfsteal_default(){ echo selfsteal >> "$LOG"; }
          restore_hysteria_mount(){ echo hysteria >> "$LOG"; }
          run_rkn_default(){ echo rkn-default >> "$LOG"; }

          : > "$LOG"
          FAKE_LEGACY_ACTION='rm -f "'$APP_DIR'/docker-compose.yml"' run_legacy
          grep -qx cleanup "$LOG"
          ! grep -qE 'selfsteal|hysteria|rkn-default' "$LOG"

          printf 'same\n' > "$APP_DIR/docker-compose.yml"
          : > "$LOG"
          FAKE_LEGACY_ACTION=':' run_legacy
          grep -qx restore-rkn "$LOG"
          grep -qx sync-rkn "$LOG"
          ! grep -qE 'selfsteal|hysteria|rkn-default' "$LOG"

          : > "$LOG"
          FAKE_LEGACY_ACTION='printf changed\\n > "'$APP_DIR'/docker-compose.yml"' run_legacy
          grep -qx selfsteal "$LOG"
          grep -qx hysteria "$LOG"
          grep -qx rkn-default "$LOG"
