name: module-hash-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/module-hash-once.yml

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print module hashes
        run: sha256sum production/remnawave-transport-manager.sh production/xhttp-signature-manager.sh production/rkn-watcher-manager.sh production/validate-generated-profile.sh
