name: debug-xhttp-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/debug-xhttp-once.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Xray
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip -o /tmp/xray.zip
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/xray.zip' | sha256sum -c -
          unzip -q /tmp/xray.zip -d /tmp/xray-bin
          sudo install -m 0755 /tmp/xray-bin/xray /usr/local/bin/xray
          sudo install -m 0644 /tmp/xray-bin/geoip.dat /usr/local/bin/geoip.dat
          sudo install -m 0644 /tmp/xray-bin/geosite.dat /usr/local/bin/geosite.dat
      - name: Debug XHTTP
        run: |
          set -u
          T="$(mktemp -d)"
          mkdir -p "$T/certs"
          chmod 755 "$T" "$T/certs"
          printf 'node.example.com\n' > "$T/.node_domain"
          printf 'www.cloudflare.com\n' > "$T/.reality_sni"
          printf 'www.cloudflare.com:443\n' > "$T/.reality_target"
          chmod 644 "$T/.node_domain" "$T/.reality_sni" "$T/.reality_target"
          echo '=== X25519 ==='
          xray x25519
          echo '=== MANAGER ==='
          sudo env PATH="$PATH" APP_DIR="$T" CAMOUFLAGE_MODE=external SNI_MODE=keep XHTTP_SIGNATURE_MODE=none bash -x production/remnawave-transport-manager.sh xhttp || rc=$?
          rc="${rc:-0}"
          echo "manager_rc=$rc"
          echo '=== TEMP/PROFILE FILES ==='
          sudo find "$T" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
          echo '=== GENERATED JSON ==='
          sudo sh -c 'for f in "$1"/remnawave-profiles/.* "$1"/remnawave-profiles/*.json; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done' _ "$T"
          exit "$rc"
