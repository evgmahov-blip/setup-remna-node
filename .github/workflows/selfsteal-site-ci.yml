name: selfsteal-site-ci

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
      - custom
  pull_request:
    branches:
      - custom

jobs:
  validate-selfsteal-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and immutable module manifest
        run: |
          set -euo pipefail
          bash -n setup_node_next.sh
          bash -n production/selfsteal-site-manager.sh
          echo 'Current module SHA256:'
          sha256sum production/selfsteal-site-manager.sh production/next-runtime-guards.sh
          sha256sum -c production/modules.sha256
          grep -Eq '^MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"$' setup_node_next.sh
          grep -q '\[production/selfsteal-site-manager.sh\]' setup_node_next.sh
          grep -q 'Маскировочный сайт — STREAM / RADIO / старые шаблоны / RANDOM' setup_node_next.sh
          grep -q '^TEMPLATES_REF="[0-9a-f]\{40\}"$' production/selfsteal-site-manager.sh
          grep -q "local selected='random' template" production/selfsteal-site-manager.sh
          grep -q '/data/streams.json' production/selfsteal-site-manager.sh
          grep -q 'ANNA_KARENINA_URL=' production/selfsteal-site-manager.sh
          grep -q "--exclude 'active,listeners'" production/selfsteal-site-manager.sh
          grep -q 'const STREAM_ORIGIN = window.location.origin;' production/selfsteal-site-manager.sh
          grep -q 'stream_has_legacy_external_dependency' production/selfsteal-site-manager.sh
          grep -q '.uniquify-manifest.txt' production/selfsteal-site-manager.sh
          if grep -Fq 'bookradio.hostingradio.ru' production/selfsteal-site-manager.sh; then
            echo 'Radio Book runtime proxy must not exist in SelfSteal manager' >&2; exit 1
          fi
          if grep -q 'patch-selfsteal' <(sed -n '/prepare_selfsteal_manager(){/,/^}/p' setup_node_next.sh); then
            echo 'Unexpected runtime SelfSteal patch path' >&2; exit 1
          fi

      - name: Fresh default is RANDOM pinned unique template
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/www"
          printf 'node.example.com\n' > "$T/.node_domain"
          sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh ensure
          STATE="$(sudo cat "$T/.selfsteal_site")"
          [[ "$STATE" == template:* ]]
          sudo test -s "$T/www/index.html"
          if sudo find "$T/www" -name '.uniquify-manifest.txt' -print -quit | grep -q .; then
            echo 'uniquify manifest leaked' >&2; exit 1
          fi
          if sudo find "$T/www" \( -name 'README.md' -o -name 'README.MD' \) -print -quit | grep -q .; then
            echo 'README leaked' >&2; exit 1
          fi
          sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh ensure
          test "$(sudo cat "$T/.selfsteal_site")" = "$STATE"

      - name: STREAM is six-channel local-only, runtime-safe and per-node unique
        run: |
          set -euo pipefail
          T1="$(mktemp -d)"; T2="$(mktemp -d)"
          mkdir -p "$T1/www" "$T2/www" "$T1/fixtures" "$T2/fixtures"
          printf 'usa2.remna.2rdp.ru\n' > "$T1/.node_domain"
          printf 'node2.example.com\n' > "$T2/.node_domain"
          for f in \
            tolstoy-teachings-ch01.mp3 \
            tolstoy-childhood-ch01.mp3 \
            anna-karenina-ch01.mp3 \
            beethoven-moonlight.mp3 \
            chopin-nocturne.mp3 \
            bach-air.mp3; do
            dd if=/dev/zero of="$T1/fixtures/$f" bs=4096 count=1 status=none
            cp "$T1/fixtures/$f" "$T2/fixtures/$f"
          done
          sudo env APP_DIR="$T1" WWW_DIR="$T1/www" \
            STREAM_AUDIO_FIXTURE_DIR="$T1/fixtures" STREAM_AUDIO_MIN_BYTES=1 STREAM_AUDIO_MAX_BYTES=1048576 \
            bash production/selfsteal-site-manager.sh stream
          sudo env APP_DIR="$T2" WWW_DIR="$T2/www" \
            STREAM_AUDIO_FIXTURE_DIR="$T2/fixtures" STREAM_AUDIO_MIN_BYTES=1 STREAM_AUDIO_MAX_BYTES=1048576 \
            bash production/selfsteal-site-manager.sh stream
          if sudo grep -RqiE 'stream\.deepbeat\.ru|/api/deepbeat-(health|history)|bookradio\.hostingradio\.ru|archive\.org|upload\.wikimedia\.org' "$T1/www"; then
            echo 'runtime external dependency leaked on usa2' >&2; exit 1
          fi
          if sudo grep -RqiE 'stream\.deepbeat\.ru|/api/deepbeat-(health|history)|bookradio\.hostingradio\.ru|archive\.org|upload\.wikimedia\.org' "$T2/www"; then
            echo 'runtime external dependency leaked on node2' >&2; exit 1
          fi
          sudo grep -Fq 'const HEALTH_API = "/data/streams.json";' "$T1/www/index.html"
          sudo grep -Fq 'const HISTORY_API = "/data/history.json";' "$T1/www/index.html"
          sudo grep -Fq 'const STREAM_ORIGIN = window.location.origin;' "$T1/www/index.html"
          sudo grep -Fq 'state.sort === "listeners"' "$T1/www/index.html"
          sudo python3 - "$T1/www/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          assert re.search(r'\$\{\s*active\s*\?', s, re.S)
          assert not re.search(r'\$\{\s*u[0-9a-f]{6,16}\s*\?', s, re.S)
          PY
          sudo jq -e '(.mounts | length) == 6 and ([.mounts | keys[] | startswith("/audio/")] | all) and ([.mounts[].listener_count] | all(. == 0))' "$T1/www/data/streams.json"
          sudo jq -e '.history == []' "$T1/www/data/history.json"
          for f in \
            tolstoy-teachings-ch01.mp3 \
            tolstoy-childhood-ch01.mp3 \
            anna-karenina-ch01.mp3 \
            beethoven-moonlight.mp3 \
            chopin-nocturne.mp3 \
            bach-air.mp3; do
            sudo test -s "$T1/www/audio/$f"
          done
          if sudo find "$T1/www" -name '.uniquify-manifest.txt' -print -quit | grep -q .; then echo 'manifest leaked' >&2; exit 1; fi
          H1="$(sudo sha256sum "$T1/www/index.html" | cut -d' ' -f1)"
          H2="$(sudo sha256sum "$T2/www/index.html" | cut -d' ' -f1)"
          test "$H1" != "$H2"
          TITLE1="$(sudo sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$T1/www/index.html" | head -1)"
          TITLE2="$(sudo sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$T2/www/index.html" | head -1)"
          test -n "$TITLE1"; test -n "$TITLE2"; test "$TITLE1" != "$TITLE2"

      - name: RADIO has hidden persistent admin path
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/www"
          printf 'node.example.com\n' > "$T/.node_domain"
          sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh radio
          test "$(sudo cat "$T/.selfsteal_site")" = radio
          ADMIN1="$(sudo cat "$T/.selfsteal_radio_admin")"
          [[ "$ADMIN1" =~ ^manage-[0-9a-f]{24}\.html$ ]]
          sudo test -s "$T/www/$ADMIN1"
          if sudo grep -q 'Управление' "$T/www/index.html"; then echo 'radio management link leaked into public page' >&2; exit 1; fi
          sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh ensure
          ADMIN2="$(sudo cat "$T/.selfsteal_radio_admin")"
          test "$ADMIN1" = "$ADMIN2"
          sudo test -s "$T/www/$ADMIN2"

      - name: Legacy template deploy has no uniquify metadata leak
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/www"
          printf 'node.example.com\n' > "$T/.node_domain"
          sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh template endless-verify
          test "$(sudo cat "$T/.selfsteal_site")" = 'template:endless-verify'
          sudo test -s "$T/www/index.html"
          if sudo find "$T/www" -name '.uniquify-manifest.txt' -print -quit | grep -q .; then echo 'manifest leaked' >&2; exit 1; fi
          if sudo find "$T/www" \( -name 'README.md' -o -name 'README.MD' \) -print -quit | grep -q .; then echo 'README leaked' >&2; exit 1; fi

      - name: Pinned manager fetched by wrapper matches checksum
        run: |
          set -euo pipefail
          REF="$(sed -nE 's/^MODULE_REF="\$\{REMNANODE_REPO_REF:-([0-9a-f]{40})\}"/\1/p' setup_node_next.sh)"
          WANT="$(awk '$2 == "production/selfsteal-site-manager.sh" {print $1}' production/modules.sha256)"
          test -n "$REF"
          test -n "$WANT"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/evgmahov-blip/setup-remna-node/${REF}/production/selfsteal-site-manager.sh" \
            -o /tmp/selfsteal-site-manager.sh
          echo "$WANT  /tmp/selfsteal-site-manager.sh" | sha256sum -c -
