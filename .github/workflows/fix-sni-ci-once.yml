name: fix-sni-ci-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/fix-sni-ci-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Patch SNI parser and CI read permission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('production/remnawave-transport-manager.sh')
          text = manager.read_text()
          old = r'''/[\047\"][A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+[\047\"]/'''
          new = r'''/[\047"][A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+[\047"]/'''
          if old not in text:
              raise SystemExit('expected SNI regexp not found')
          manager.write_text(text.replace(old, new, 1))

          ci = Path('.github/workflows/transport-profile-ci.yml')
          text = ci.read_text()
          old = 'count="$(sudo wc -l < "$T/reality-targets.cache")"'
          new = 'count="$(sudo wc -l "$T/reality-targets.cache" | awk \'{print $1}\')"'
          if old not in text:
              raise SystemExit('expected CI count command not found')
          ci.write_text(text.replace(old, new, 1))
          PY

          bash -n production/remnawave-transport-manager.sh
          sha256sum \
            production/remnawave-transport-manager.sh \
            production/xhttp-signature-manager.sh \
            production/rkn-watcher-manager.sh \
            production/validate-generated-profile.sh \
            > production/modules.sha256

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/remnawave-transport-manager.sh production/modules.sha256 .github/workflows/transport-profile-ci.yml
          git commit -m 'Fix mawk SNI parser warning and CI cache read'
          MODULE_REF="$(git rev-parse HEAD)"

          python3 - "$MODULE_REF" <<'PY'
          import re, sys
          from pathlib import Path

          module_ref = sys.argv[1]
          wrapper = Path('setup_node_next.sh')
          text = wrapper.read_text()
          replacement = 'MODULE_REF="$' + '{REMNANODE_REPO_REF:-' + module_ref + '}"'
          text, n = re.subn(
              r'MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"',
              replacement,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('failed to replace MODULE_REF')

          for line in Path('production/modules.sha256').read_text().splitlines():
              digest, path = line.split(None, 1)
              pattern = re.escape(f'[{path}]') + r'="[0-9a-f]{64}"'
              repl = f'[{path}]="{digest}"'
              text, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f'failed to update wrapper hash for {path}')
          wrapper.write_text(text)
          PY

          bash -n setup_node_next.sh
          git add setup_node_next.sh
          git commit -m 'Advance immutable module pin after SNI fix'
          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
