name: fix-runtime-temp-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/fix-runtime-temp-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Patch temp JSON names and repin modules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('production/remnawave-transport-manager.sh'): {
                  'mktemp "$PROFILE_DIR/.xhttp-reality.XXXXXX"': 'mktemp "$PROFILE_DIR/.xhttp-reality.XXXXXX.json"',
                  'mktemp "$PROFILE_DIR/.xhttp-sig.XXXXXX"': 'mktemp "$PROFILE_DIR/.xhttp-sig.XXXXXX.json"',
                  'mktemp "$PROFILE_DIR/.raw-reality.XXXXXX"': 'mktemp "$PROFILE_DIR/.raw-reality.XXXXXX.json"',
                  'mktemp "$PROFILE_DIR/.hysteria2-tls.XXXXXX"': 'mktemp "$PROFILE_DIR/.hysteria2-tls.XXXXXX.json"',
              },
              Path('production/xhttp-signature-manager.sh'): {
                  'mktemp "$PROFILE_DIR/.xhttp-signature.XXXXXX"': 'mktemp "$PROFILE_DIR/.xhttp-signature.XXXXXX.json"',
                  'mktemp "$PROFILE_DIR/.xhttp-revert.XXXXXX"': 'mktemp "$PROFILE_DIR/.xhttp-revert.XXXXXX.json"',
              },
          }

          for path, reps in replacements.items():
              text = path.read_text()
              for old, new in reps.items():
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          bash -n production/remnawave-transport-manager.sh
          bash -n production/xhttp-signature-manager.sh

          sha256sum \
            production/remnawave-transport-manager.sh \
            production/xhttp-signature-manager.sh \
            production/rkn-watcher-manager.sh \
            production/validate-generated-profile.sh \
            > production/modules.sha256

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/remnawave-transport-manager.sh production/xhttp-signature-manager.sh production/modules.sha256
          git commit -m 'Fix runtime validation for extensionless temp profiles'
          MODULE_REF="$(git rev-parse HEAD)"

          python3 - "$MODULE_REF" <<'PY'
          import re, sys
          from pathlib import Path

          module_ref = sys.argv[1]
          wrapper = Path('setup_node_next.sh')
          text = wrapper.read_text()
          text, n = re.subn(
              r'MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"',
              f'MODULE_REF="${{REMNANODE_REPO_REF:-{module_ref}}}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('failed to replace MODULE_REF')

          manifest = {}
          for line in Path('production/modules.sha256').read_text().splitlines():
              digest, path = line.split(None, 1)
              manifest[path] = digest

          for path, digest in manifest.items():
              pattern = re.escape(f'[{path}]') + r'="[0-9a-f]{64}"'
              repl = f'[{path}]="{digest}"'
              text, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f'failed to update wrapper hash for {path}')

          wrapper.write_text(text)
          PY

          bash -n setup_node_next.sh
          git add setup_node_next.sh
          git commit -m 'Advance immutable module pin after runtime temp fix'

          rm -f .github/workflows/debug-xhttp-once.yml .github/workflows/fix-runtime-temp-once.yml
          git add -A .github/workflows
          git commit -m 'Remove one-shot runtime debug workflows'

          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
