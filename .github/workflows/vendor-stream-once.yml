name: vendor-stream-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/vendor-stream-once.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Capture STREAM site
        run: |
          set -euo pipefail
          sources=(
            'https://rustream.remna.space'
            'https://est.remna.2rdp.ru'
            'https://nl.remna.2rdp.ru'
          )
          captured=''

          for src in "${sources[@]}"; do
            echo "Trying STREAM source: $src"
            rm -rf selfsteal/stream
            mkdir -p selfsteal/stream

            wget \
              --timeout=20 \
              --tries=2 \
              --user-agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              --page-requisites \
              --convert-links \
              --adjust-extension \
              --no-host-directories \
              --directory-prefix=selfsteal/stream \
              "$src/" || true

            idx="$(find selfsteal/stream -type f \( -name 'index.html' -o -name 'index.html.*' \) -print -quit)"
            if [ -n "$idx" ] && [ -s "$idx" ] && grep -Eqi '<!doctype|<html' "$idx"; then
              if [ "$idx" != 'selfsteal/stream/index.html' ]; then
                cp "$idx" selfsteal/stream/index.html
              fi
              captured="$src"
              break
            fi
          done

          test -n "$captured"
          printf '%s\n' "$captured" > selfsteal/stream/SOURCE.txt
          echo "Captured STREAM from: $captured"
          find selfsteal/stream -maxdepth 5 -type f -print | sort

      - name: Commit captured site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selfsteal/stream
          if git diff --cached --quiet; then
            echo 'STREAM snapshot is already current.'
          else
            git commit -m 'Vendor STREAM SelfSteal site snapshot'
            git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
          fi
