name: wire-selfsteal-sites-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/wire-selfsteal-sites-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Wire SelfSteal site manager
        shell: bash
        run: |
          set -euo pipefail
          MODREF='e7895ba764bcfa969abb428ef0fd04a61a3d368f'
          SELF_HASH="$(sha256sum production/selfsteal-site-manager.sh | awk '{print $1}')"
          export MODREF SELF_HASH

          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('setup_node_next.sh')
          s = p.read_text()
          modref = os.environ['MODREF']
          h = os.environ['SELF_HASH']

          s = re.sub(
              r'MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"',
              f'MODULE_REF="${{REMNANODE_REPO_REF:-{modref}}}"',
              s,
              count=1,
          )

          if '[production/selfsteal-site-manager.sh]' not in s:
              needle = '  [production/validate-generated-profile.sh]='
              idx = s.index(needle)
              s = s[:idx] + f'  [production/selfsteal-site-manager.sh]="{h}"\n' + s[idx:]

          old = '''run_legacy(){
            local f="$WORK_DIR/setup_node-legacy.sh"
            echo -e "${GREEN}[STABLE 07.07]${NC} Запускаю зафиксированную рабочую базу."
            echo -e "${GRAY}Commit: ${LEGACY_COMMIT}${NC}"
            fetch_url "${LEGACY_RAW}/setup_node.sh" "$f" "setup_node.sh@${LEGACY_COMMIT}" "$LEGACY_SHA256" || return 1
            bash "$f"
          }
          '''
          new = '''run_selfsteal_default(){
            local f="$WORK_DIR/selfsteal-site-manager.sh"
            fetch_module "production/selfsteal-site-manager.sh" "$f" || return 1
            APP_DIR="$APP_DIR" bash "$f" ensure
          }

          run_selfsteal_site(){
            local f="$WORK_DIR/selfsteal-site-manager.sh"
            fetch_module "production/selfsteal-site-manager.sh" "$f" || return 1
            APP_DIR="$APP_DIR" bash "$f" choose
          }

          run_legacy(){
            local f="$WORK_DIR/setup_node-legacy.sh" rc
            echo -e "${GREEN}[STABLE 07.07]${NC} Запускаю зафиксированную рабочую базу."
            echo -e "${GRAY}Commit: ${LEGACY_COMMIT}${NC}"
            fetch_url "${LEGACY_RAW}/setup_node.sh" "$f" "setup_node.sh@${LEGACY_COMMIT}" "$LEGACY_SHA256" || return 1
            if bash "$f"; then
              if [[ -d /var/www/html && -f "$APP_DIR/docker-compose.yml" ]]; then
                echo -e "${GREEN}[SELFSTEAL]${NC} Применяю сохранённый сайт; если выбор ещё не делали — STREAM."
                run_selfsteal_default
              fi
            else
              rc=$?
              return "$rc"
            fi
          }
          '''
          if old not in s:
              raise SystemExit('run_legacy block not found')
          s = s.replace(old, new, 1)

          status_needle = "  printf '  %-22s %s\\n' 'Reality target:' \"$(cat \"$APP_DIR/.reality_target\" 2>/dev/null || echo '-')\"\n"
          if "'SelfSteal site:'" not in s:
              s = s.replace(
                  status_needle,
                  status_needle + "  printf '  %-22s %s\\n' 'SelfSteal site:' \"$(cat \"$APP_DIR/.selfsteal_site\" 2>/dev/null || echo 'stream (default)')\"\n",
                  1,
              )

          s = s.replace(
              '    echo -e "   ${WHITE}6)${NC} 🎭 Показать текущий SNI / target / состояние пула"\n',
              '    echo -e "   ${WHITE}6)${NC} 🎭 Показать текущий SNI / target / состояние пула"\n'
              '    echo -e "   ${WHITE}7)${NC} 🌐 SelfSteal сайт — STREAM / RADIO ${GRAY}(default: STREAM)${NC}"\n',
              1,
          )
          s = s.replace(
              '    echo -e "   ${WHITE}7)${NC} 🛡️  RKN Watcher — установка / статус / apply / удаление"',
              '    echo -e "   ${WHITE}8)${NC} 🛡️  RKN Watcher — установка / статус / apply / удаление"',
              1,
          )
          s = s.replace(
              'SelfSteal сайты, SSL, Telemt, Xray version, UFW, IPv6, логи, тесты — пункт 1.',
              'SSL, Telemt, Xray version, UFW, IPv6, логи, тесты — пункт 1.',
              1,
          )
          s = s.replace("read -r -p 'Выбери действие [0-7]: ' choice", "read -r -p 'Выбери действие [0-8]: ' choice", 1)
          s = s.replace(
              '      6) show_sni ;;\n      7) run_rkn; pause ;;',
              '      6) show_sni ;;\n      7) run_selfsteal_site; pause ;;\n      8) run_rkn; pause ;;',
              1,
          )

          p.write_text(s)

          m = pathlib.Path('production/modules.sha256')
          lines = [x for x in m.read_text().splitlines() if not x.endswith('  production/selfsteal-site-manager.sh')]
          lines.append(f'{h}  production/selfsteal-site-manager.sh')
          m.write_text('\n'.join(lines) + '\n')
          PY

          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('.github/workflows/transport-profile-ci.yml')
          s = p.read_text()
          if 'bash -n production/selfsteal-site-manager.sh' not in s:
              s = s.replace(
                  '          bash -n production/validate-generated-profile.sh\n',
                  '          bash -n production/validate-generated-profile.sh\n          bash -n production/selfsteal-site-manager.sh\n',
                  1,
              )
          if 'SelfSteal default STREAM and RADIO' not in s:
              marker = '      - name: Install pinned Xray v26.7.28\n'
              step = '''      - name: SelfSteal default STREAM and RADIO
                run: |
                  set -euo pipefail
                  T="$(mktemp -d)"
                  mkdir -p "$T/www"
                  printf 'node.example.com\\n' > "$T/.node_domain"
                  sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh ensure
                  test "$(sudo cat "$T/.selfsteal_site")" = stream
                  sudo grep -q 'mstream' "$T/www/index.html"
                  sudo env APP_DIR="$T" WWW_DIR="$T/www" bash production/selfsteal-site-manager.sh radio
                  test "$(sudo cat "$T/.selfsteal_site")" = radio
                  ADMIN="$(sudo cat "$T/.selfsteal_radio_admin")"
                  test -s "$T/www/$ADMIN"
                  ! grep -q 'Управление' "$T/www/index.html"

          '''
              if marker not in s:
                  raise SystemExit('CI insertion marker not found')
              s = s.replace(marker, step + marker, 1)
          p.write_text(s)
          PY

          bash -n setup_node_next.sh
          bash -n production/selfsteal-site-manager.sh
          sha256sum -c production/modules.sha256

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add setup_node_next.sh production/modules.sha256 .github/workflows/transport-profile-ci.yml
          git commit -m 'Wire default STREAM and selectable RADIO SelfSteal sites'
          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
