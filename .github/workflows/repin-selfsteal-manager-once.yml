name: repin-selfsteal-manager-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/repin-selfsteal-manager-once.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Repin wrapper and manifest
        run: |
          set -euo pipefail
          REF='fb4460702eccfff7268a9e5f1100d622dfae3fa6'
          HASH="$(sha256sum production/selfsteal-site-manager.sh | awk '{print $1}')"
          export REF HASH
          python3 - <<'PY'
          import os, pathlib, re
          ref = os.environ['REF']
          h = os.environ['HASH']

          p = pathlib.Path('setup_node_next.sh')
          s = p.read_text()
          replacement = 'MODULE_REF="' + '$' + '{REMNANODE_REPO_REF:-' + ref + '}"'
          s, n = re.subn(
              r'MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"',
              replacement,
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('MODULE_REF replacement failed')
          s, n = re.subn(
              r'^  \[production/selfsteal-site-manager\.sh\]="[0-9a-f]{64}"$',
              f'  [production/selfsteal-site-manager.sh]="{h}"',
              s,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit('wrapper SelfSteal checksum replacement failed')
          p.write_text(s)

          m = pathlib.Path('production/modules.sha256')
          lines = [x for x in m.read_text().splitlines() if not x.endswith('  production/selfsteal-site-manager.sh')]
          lines.append(f'{h}  production/selfsteal-site-manager.sh')
          m.write_text('\n'.join(lines) + '\n')
          PY

          bash -n setup_node_next.sh
          bash -n production/selfsteal-site-manager.sh
          sha256sum -c production/modules.sha256
          curl -fsSL --proto '=https' "https://raw.githubusercontent.com/evgmahov-blip/setup-remna-node/${REF}/production/selfsteal-site-manager.sh" -o /tmp/selfsteal-fixed.sh
          echo "$HASH  /tmp/selfsteal-fixed.sh" | sha256sum -c -

      - name: Commit repin
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add setup_node_next.sh production/modules.sha256
          git commit -m 'Repin fixed SelfSteal site manager'
          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
