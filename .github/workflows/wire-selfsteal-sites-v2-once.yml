name: wire-selfsteal-sites-v2-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/wire-selfsteal-sites-v2-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Apply wiring patch
        run: python3 tools/wire_selfsteal_sites.py

      - name: Verify patched files
        run: |
          set -euo pipefail
          bash -n setup_node_next.sh
          bash -n production/selfsteal-site-manager.sh
          sha256sum -c production/modules.sha256
          grep -q 'run_selfsteal_default' setup_node_next.sh
          grep -q 'SelfSteal сайт — STREAM / RADIO' setup_node_next.sh
          grep -q 'SelfSteal default STREAM and RADIO' .github/workflows/transport-profile-ci.yml

      - name: Commit wrapper and manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add setup_node_next.sh production/modules.sha256
          if git diff --cached --quiet; then
            echo 'No wiring changes required.'
          else
            git commit -m 'Wire default STREAM and selectable RADIO SelfSteal sites'
            git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
          fi
