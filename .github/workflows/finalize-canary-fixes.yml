name: finalize-canary-fixes

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Apply canary fixes and repin immutable modules
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('production/rkn-watcher-manager.sh')
          s = p.read_text(encoding='utf-8')
          pattern = r'''activate_safe\(\)\{\n.*?\n\}\n\nrefresh_lists\(\)\{'''
          replacement = r'''normalize_yes_no_answer(){
            local value="${1-}"
            value="${value//$'\r'/}"
            value="$(printf '%s' "$value" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            value="${value,,}"
            case "$value" in
              ''|y|yes|д|да) printf 'yes' ;;
              n|no|н|нет) printf 'no' ;;
              *) printf 'invalid'; return 1 ;;
            esac
          }

          rkn_input_selftest(){
            local failed=0 got input expected
            while IFS='|' read -r input expected; do
              if got="$(normalize_yes_no_answer "$input")" && [[ "$got" == "$expected" ]]; then
                :
              else
                printf '[SELFTEST FAIL] input=%q expected=%s got=%s\n' "$input" "$expected" "${got:-ERROR}" >&2
                failed=1
              fi
            done <<'EOF_CASES'
          |yes
          y|yes
          Y|yes
           y |yes
          yes|yes
          YES|yes
          д|yes
          ДА|yes
          n|no
          N|no
           no |no
          НЕТ|no
          EOF_CASES
            input=$'y\r'
            if got="$(normalize_yes_no_answer "$input")" && [[ "$got" == yes ]]; then :; else echo '[SELFTEST FAIL] CRLF y' >&2; failed=1; fi
            if normalize_yes_no_answer 'maybe' >/dev/null 2>&1; then echo '[SELFTEST FAIL] invalid answer accepted' >&2; failed=1; fi
            (( failed == 0 )) && echo '[OK] RKN confirmation input selftest'
            return "$failed"
          }

          activate_safe(){
            local answer='no' raw=''
            [[ -x "$GUARD_SCRIPT" ]] || { err 'Scanner guard не установлен'; return 1; }
            record_safe_allow_ips
            write_safe_config
            schedule_rollback

            if ! "$GUARD_SCRIPT" apply || ! verify_guard; then
              echo '[ERROR] Проверка scanner guard не прошла; выполняю немедленный rollback.'
              "$GUARD_SCRIPT" remove || true
              cancel_rollback
              return 1
            fi

            echo
            echo '[SAFE] Защита от известных TSPU/Skipa scanners уже активна.'
            echo '[SAFE] DROP только tcp/80, tcp/443 и udp/443 для IP из TSPUIPS.'
            echo '[SAFE] Если выбрать n/No или потерять сессию, через 120 секунд guard будет снят.'

            if [[ "${RKN_ASSUME_KEEP:-0}" == '1' ]]; then
              answer='yes'
            elif [[ -t 0 ]]; then
              while true; do
                raw=''
                read -r -p 'Оставить защиту постоянно? [Y/n]: ' raw || raw='n'
                if answer="$(normalize_yes_no_answer "$raw")"; then
                  break
                fi
                echo '[WARN] Неверный ответ. Введите y/yes или n/no.'
              done
            fi

            case "$answer" in
              yes)
                cancel_rollback
                "$GUARD_SCRIPT" apply
                enable_safe_autostart
                printf 'active\n' > "$ACTIVE_STATE"
                chmod 600 "$ACTIVE_STATE"
                echo '[OK] SAFE SCANNER MODE зафиксирован: boot restore + daily update включены.'
                ;;
              no)
                disable_all_autostart
                rm -f "$ACTIVE_STATE"
                echo '[INFO] Выбрано No. Автооткат оставлен; защита будет снята максимум через 120 секунд.'
                ;;
              *)
                echo '[ERROR] Внутренняя ошибка нормализации ответа; оставляю rollback активным.' >&2
                disable_all_autostart
                rm -f "$ACTIVE_STATE"
                return 1
                ;;
            esac
          }

          refresh_lists(){'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'activate_safe replacement count={n}')
          s = s2

          old = '''main(){
            need_root
            case "${1:-menu}" in
          '''
          new = '''main(){
            if [[ "${1:-}" == 'selftest-input' ]]; then
              rkn_input_selftest
              return $?
            fi
            need_root
            case "${1:-menu}" in
          '''
          if old not in s:
              raise SystemExit('main marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/rkn-safe-ci.yml')
          s = p.read_text(encoding='utf-8')
          old = '''          grep -Fq 'Оставить защиту постоянно? [Y/n]:' "$f"
          grep -Fq 'answer="${answer:-y}"' "$f"
          grep -Fq 'y|yes)' "$f"
          ! grep -Fq "trap 'rm -rf \\\"\\$tmp\\\"' RETURN" "$f"
          grep -Fq 'rm -rf "$tmp"' "$f"
          '''
          new = '''          grep -Fq 'Оставить защиту постоянно? [Y/n]:' "$f"
          grep -Fq 'normalize_yes_no_answer' "$f"
          grep -Fq "selftest-input" "$f"
          bash "$f" selftest-input
          ! grep -Fq "trap 'rm -rf \\\"\\$tmp\\\"' RETURN" "$f"
          grep -Fq 'rm -rf "$tmp"' "$f"
          '''
          if old not in s:
              raise SystemExit('rkn-safe-ci confirmation block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n production/rkn-watcher-manager.sh
          bash production/rkn-watcher-manager.sh selftest-input

          cp production/rkn-watcher-manager.sh /tmp/rkn-patched.sh
          cp production/next-runtime-guards.sh /tmp/runtime-guards-probe.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/runtime-guards-probe.sh')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'^RKN_PATCHED_MANAGER_SHA256="[0-9a-f]{64}"$', 'RKN_PATCHED_MANAGER_SHA256="' + ('0'*64) + '"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('runtime guard probe SHA marker not found')
          p.write_text(s, encoding='utf-8')
          PY

          set +e
          APP_DIR=/tmp/remnanode-finalize bash /tmp/runtime-guards-probe.sh patch-rkn /tmp/rkn-patched.sh >/tmp/rkn-patch-probe.log 2>&1
          PROBE_RC=$?
          set -e
          grep -Fq 'validate_scanner_set' /tmp/rkn-patched.sh
          grep -Fq 'last-good-tspu.ipset' /tmp/rkn-patched.sh
          PATCHED_RKN_SHA="$(sha256sum /tmp/rkn-patched.sh | awk '{print $1}')"
          echo "probe_rc=$PROBE_RC patched_rkn_sha=$PATCHED_RKN_SHA"

          python3 - "$PATCHED_RKN_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          want=sys.argv[1]
          p=Path('production/next-runtime-guards.sh')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'^RKN_PATCHED_MANAGER_SHA256="[0-9a-f]{64}"$', f'RKN_PATCHED_MANAGER_SHA256="{want}"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('runtime guard SHA marker not found')
          p.write_text(s, encoding='utf-8')
          PY

          RKN_SHA="$(sha256sum production/rkn-watcher-manager.sh | awk '{print $1}')"
          GUARD_SHA="$(sha256sum production/next-runtime-guards.sh | awk '{print $1}')"
          python3 - "$RKN_SHA" "$GUARD_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          rkn, guard=sys.argv[1:3]
          p=Path('production/modules.sha256')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'^[0-9a-f]{64}  production/rkn-watcher-manager\.sh$', f'{rkn}  production/rkn-watcher-manager.sh', s, count=1, flags=re.M)
          s,n2=re.subn(r'^[0-9a-f]{64}  production/next-runtime-guards\.sh$', f'{guard}  production/next-runtime-guards.sh', s, count=1, flags=re.M)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'module manifest replacements rkn={n1} guard={n2}')
          p.write_text(s, encoding='utf-8')
          PY

          bash -n production/next-runtime-guards.sh
          sha256sum -c production/modules.sha256

          git add production/rkn-watcher-manager.sh production/next-runtime-guards.sh production/modules.sha256 .github/workflows/rkn-safe-ci.yml
          git commit -m 'fix: harden RKN confirmation after live canary'
          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7

          MODULE_REF="$(git rev-parse HEAD)"
          RKN_SHA="$(sha256sum production/rkn-watcher-manager.sh | awk '{print $1}')"
          GUARD_SHA="$(sha256sum production/next-runtime-guards.sh | awk '{print $1}')"

          python3 - "$MODULE_REF" "$RKN_SHA" "$GUARD_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          module_ref, rkn_sha, guard_sha=sys.argv[1:4]
          p=Path('setup_node_next.sh')
          s=p.read_text(encoding='utf-8')

          s,n=re.subn(r'^MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"$', f'MODULE_REF="${{REMNANODE_REPO_REF:-{module_ref}}}"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('MODULE_REF replacement failed')
          s,n=re.subn(r'^  \[production/rkn-watcher-manager\.sh\]="[0-9a-f]{64}"$', f'  [production/rkn-watcher-manager.sh]="{rkn_sha}"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('wrapper RKN hash replacement failed')
          s,n=re.subn(r'^  \[production/next-runtime-guards\.sh\]="[0-9a-f]{64}"$', f'  [production/next-runtime-guards.sh]="{guard_sha}"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('wrapper runtime guard hash replacement failed')

          marker='''  ' "$f" > "$tmp"; then
            rm -f "$tmp"; echo -e "${RED}[ОШИБКА]${NC} Не удалось безопасно адаптировать July base"; return 1
          fi
          '''
          replacement='''  ' "$f" > "$tmp"; then
            rm -f "$tmp"; echo -e "${RED}[ОШИБКА]${NC} Не удалось безопасно адаптировать July base"; return 1
          fi
          sed -i \\
            -e 's/echo " 0) Выход"/echo " 0) ↩️ Назад в REMNANODE NEXT"/' \\
            -e 's/Вы можете запускать это меню командой: ${GREEN}remnanode${NC}/Вы можете запускать это меню командой: ${GREEN}remnanode-next${NC}/' \\
            "$tmp"
          '''
          if marker not in s:
              raise SystemExit('legacy adaptation insertion marker not found')
          s=s.replace(marker,replacement,1)

          old='''     || grep -Eq '^[[:space:]]*11\\) run_telemt_installer ;;' "$tmp" \\
             || grep -q '^    register_globally$' "$tmp"; then
          '''
          new='''     || grep -Eq '^[[:space:]]*11\\) run_telemt_installer ;;' "$tmp" \\
             || grep -q '^    register_globally$' "$tmp" \\
             || grep -Fq 'echo " 0) Выход"' "$tmp" \\
             || grep -Fq 'командой: ${GREEN}remnanode${NC}' "$tmp"; then
          '''
          if old not in s:
              raise SystemExit('legacy rejection marker not found')
          s=s.replace(old,new,1)

          check='''  grep -Fq 'NEXT_ACTION_FILE' "$tmp" || { rm -f "$tmp"; echo -e "${RED}[ОШИБКА]${NC} Legacy uninstall marker не применён"; return 1; }
          '''
          add='''  grep -Fq 'NEXT_ACTION_FILE' "$tmp" || { rm -f "$tmp"; echo -e "${RED}[ОШИБКА]${NC} Legacy uninstall marker не применён"; return 1; }
          grep -Fq '0) ↩️ Назад в REMNANODE NEXT' "$tmp" || { rm -f "$tmp"; echo -e "${RED}[ОШИБКА]${NC} Legacy пункт возврата в NEXT не применён"; return 1; }
          grep -Fq 'командой: ${GREEN}remnanode-next${NC}' "$tmp" || { rm -f "$tmp"; echo -e "${RED}[ОШИБКА]${NC} Legacy подсказка команды remnanode-next не применена"; return 1; }
          '''
          if check not in s:
              raise SystemExit('legacy verification marker not found')
          s=s.replace(check,add,1)
          p.write_text(s, encoding='utf-8')
          PY

          bash -n setup_node_next.sh
          grep -Fq 'Назад в REMNANODE NEXT' setup_node_next.sh
          grep -Fq 'remnanode-next${NC}' setup_node_next.sh

          git add setup_node_next.sh
          git rm .github/workflows/finalize-canary-fixes.yml
          git commit -m 'fix: clarify nested NEXT return and repin modules'
          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
