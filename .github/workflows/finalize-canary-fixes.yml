name: finalize-canary-fixes

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - tools/finalize_canary_fixes_v2.py
      - .github/workflows/finalize-canary-fixes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0
      - name: Finalize live-canary fixes
        run: python3 tools/finalize_canary_fixes_v2.py
