name: add-node-inbound-names-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/add-node-inbound-names-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Patch node-based inbound names and repin modules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('production/remnawave-transport-manager.sh')
          s = p.read_text()

          old = 'NODE_DOMAIN_FILE="$APP_DIR/.node_domain"\nTRANSPORT_FILE="$APP_DIR/.transport"'
          new = 'NODE_DOMAIN_FILE="$APP_DIR/.node_domain"\nNODE_NAME_FILE="$APP_DIR/.node_name"\nTRANSPORT_FILE="$APP_DIR/.transport"'
          if old not in s:
              raise SystemExit('NODE_DOMAIN_FILE anchor not found')
          s = s.replace(old, new, 1)

          anchor = '\nxray_cmd(){\n'
          insert = "\n".join([
              '',
              'node_name(){',
              '  local n="${NODE_NAME:-}" detected=""',
              '  if [[ -z "$n" && -r "$NODE_NAME_FILE" ]]; then',
              '    n="$(head -n1 "$NODE_NAME_FILE" | tr -d \'\\r\\n\')"',
              '  fi',
              '  if [[ -z "$n" ]]; then',
              '    detected="$(hostname -s 2>/dev/null || hostname 2>/dev/null || true)"',
              '    n="$detected"',
              '  fi',
              '  if [[ -z "$n" ]]; then',
              '    n="$(node_domain)"',
              '    n="${n%%.*}"',
              '  fi',
              '  n="$(printf \'%s\' "$n" | sed -E \'s/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//\')"',
              '  [[ -n "$n" ]] || { fail "Не удалось определить имя сервера для inbound"; return 1; }',
              '  printf \'%s\\n\' "$n" > "$NODE_NAME_FILE"',
              '  chmod 600 "$NODE_NAME_FILE"',
              '  printf \'%s\' "$n"',
              '}',
              '',
              'inbound_name(){',
              '  local base transport="$1"',
              '  base="$(node_name)" || return 1',
              '  case "$transport" in',
              '    xhttp) printf \'%s-xHTTP\' "$base" ;;',
              '    raw) printf \'%s-RAW\' "$base" ;;',
              '    hysteria) printf \'%s-Hysteria2\' "$base" ;;',
              '    *) fail "Неизвестный транспорт для имени inbound: $transport"; return 1 ;;',
              '  esac',
              '}',
              ''
          ])
          if anchor not in s:
              raise SystemExit('xray_cmd anchor not found')
          s = s.replace(anchor, insert + anchor, 1)

          replacements = [
              ('write_xhttp_profile(){\n  local f="$PROFILE_DIR/xhttp-reality.json" tmp tmp2 sig="$APP_DIR/xhttp-signature.json"\n  resolve_xhttp_path',
               'write_xhttp_profile(){\n  local f="$PROFILE_DIR/xhttp-reality.json" tmp tmp2 sig="$APP_DIR/xhttp-signature.json" inbound\n  inbound="$(inbound_name xhttp)" || return 1\n  resolve_xhttp_path'),
              ('      "tag": "XHTTP_REALITY",', '      "tag": "$inbound",'),
              ('write_raw_profile(){\n  local f="$PROFILE_DIR/raw-reality.json" tmp\n  tmp=',
               'write_raw_profile(){\n  local f="$PROFILE_DIR/raw-reality.json" tmp inbound\n  inbound="$(inbound_name raw)" || return 1\n  tmp='),
              ('      "tag": "RAW_REALITY",', '      "tag": "$inbound",'),
              ('write_hysteria_profile(){\n  local f="$PROFILE_DIR/hysteria2-tls.json" masq tmp\n  [[ -s',
               'write_hysteria_profile(){\n  local f="$PROFILE_DIR/hysteria2-tls.json" masq tmp inbound\n  inbound="$(inbound_name hysteria)" || return 1\n  [[ -s'),
              ('      "tag": "HYSTERIA2_TLS",', '      "tag": "$inbound",'),
              ('write_host_values(){\n  local transport="$1" d minver\n  d="$(node_domain)"',
               'write_host_values(){\n  local transport="$1" d minver inbound\n  d="$(node_domain)"\n  inbound="$(inbound_name "$transport")" || return 1'),
              ('Remark: XHTTP-REALITY\nInbound: XHTTP_REALITY', 'Remark: $inbound\nInbound: $inbound'),
              ('Remark: RAW-REALITY\nInbound: RAW_REALITY', 'Remark: $inbound\nInbound: $inbound'),
              ('Remark: HYSTERIA2-TLS\nInbound: HYSTERIA2_TLS', 'Remark: $inbound\nInbound: $inbound'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected block not found: {old[:80]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          bash -n production/remnawave-transport-manager.sh
          sha256sum \
            production/remnawave-transport-manager.sh \
            production/xhttp-signature-manager.sh \
            production/rkn-watcher-manager.sh \
            production/validate-generated-profile.sh \
            > production/modules.sha256

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/remnawave-transport-manager.sh production/modules.sha256
          git commit -m 'Name generated inbounds after the server'
          MODULE_REF="$(git rev-parse HEAD)"

          python3 - "$MODULE_REF" <<'PY'
          import re, sys
          from pathlib import Path

          module_ref = sys.argv[1]
          wrapper = Path('setup_node_next.sh')
          text = wrapper.read_text()
          replacement = 'MODULE_REF="$' + '{REMNANODE_REPO_REF:-' + module_ref + '}"'
          text, n = re.subn(
              r'MODULE_REF="\$\{REMNANODE_REPO_REF:-[0-9a-f]{40}\}"',
              replacement,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('failed to replace MODULE_REF')

          for line in Path('production/modules.sha256').read_text().splitlines():
              digest, path = line.split(None, 1)
              pattern = re.escape(f'[{path}]') + r'="[0-9a-f]{64}"'
              repl = f'[{path}]="{digest}"'
              text, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f'failed to update wrapper hash for {path}')
          wrapper.write_text(text)
          PY

          bash -n setup_node_next.sh
          git add setup_node_next.sh
          git commit -m 'Advance immutable module pin for node-based inbound names'
          git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
