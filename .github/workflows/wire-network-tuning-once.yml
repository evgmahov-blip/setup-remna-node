name: wire-network-tuning-once

on:
  push:
    branches:
      - fix/xhttp-raw-hysteria-from-july7
    paths:
      - .github/workflows/wire-network-tuning-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xhttp-raw-hysteria-from-july7
          fetch-depth: 0

      - name: Patch NEXT wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('setup_node_next.sh')
          s = p.read_text()

          old = '  if bash "$f"; then\n    if [[ -d /var/www/html && -f "$APP_DIR/docker-compose.yml" ]]; then\n'
          new = '  if bash "$f"; then\n    echo -e "${GREEN}[NETWORK]${NC} Применяю проверенный NEXT-профиль сети: fq + BBR по умолчанию, если BBR доступен."\n    if ! run_network_tuning; then\n      echo -e "${YELLOW}[ПРЕДУПРЕЖДЕНИЕ]${NC} Базовая установка завершена, но сетевой профиль прошёл не все проверки."\n    fi\n    if [[ -d /var/www/html && -f "$APP_DIR/docker-compose.yml" ]]; then\n'
          if '[NETWORK]' not in s:
              if old not in s:
                  raise SystemExit('run_legacy insertion point not found')
              s = s.replace(old, new, 1)

          status_old = '  printf \'  %-22s %s\\n\' \'SelfSteal site:\' "$(cat "$APP_DIR/.selfsteal_site" 2>/dev/null || echo \'stream (default)\')"\n'
          status_new = status_old + '  printf \'  %-22s %s\\n\' \'TCP CC:\' "$(sysctl -n net.ipv4.tcp_congestion_control 2>/dev/null || echo \'-\')"\n  printf \'  %-22s %s\\n\' \'Default qdisc:\' "$(sysctl -n net.core.default_qdisc 2>/dev/null || echo \'-\')"\n'
          if "'TCP CC:'" not in s:
              if status_old not in s:
                  raise SystemExit('status insertion point not found')
              s = s.replace(status_old, status_new, 1)

          p.write_text(s)
          PY

          bash -n setup_node_next.sh
          grep -q '121a6d1d74d72454758f278169b0144c91aa0f9e' setup_node_next.sh
          grep -q 'production/network-tuning-manager.sh' setup_node_next.sh
          grep -q '\[NETWORK\]' setup_node_next.sh
          grep -q "'TCP CC:'" setup_node_next.sh

      - name: Commit wrapper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add setup_node_next.sh
          if git diff --cached --quiet; then
            echo 'Wrapper already wired.'
          else
            git commit -m 'Finish verified BBR network tuning wiring'
            git push origin HEAD:fix/xhttp-raw-hysteria-from-july7
          fi
