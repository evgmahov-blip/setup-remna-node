<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#193a45">
<title>mstream · Streams</title>

<style>
:root {
    color-scheme: light;

    --page: #e4ebe9;
    --page-blue: #dce8ed;
    --surface: rgba(255,255,255,.72);
    --surface-border: rgba(27,67,78,.13);

    --card: #22434c;
    --card-dark: #193741;
    --card-hover: #28515e;
    --card-active: #24596b;
    --card-border: rgba(255,255,255,.11);

    --button: #102c36;
    --button-hover: #0b232c;

    --text: #18383d;
    --text-soft: #60777a;
    --light: #f5fbfc;
    --light-soft: #b8cdd1;

    --green: #5ea88c;
    --blue: #61a9d1;
    --blue-light: #93cbe7;
    --red: #ff6e82;

    --shadow: 0 14px 36px rgba(28,61,70,.12);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--page);
}

body {
    min-height: 100vh;
    margin: 0;
    padding-bottom: 84px;

    color: var(--text);

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(116,172,151,.25),
            transparent 34%
        ),
        radial-gradient(
            circle at 94% 5%,
            rgba(91,161,203,.26),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            #f2f1e8 0%,
            var(--page) 46%,
            var(--page-blue) 100%
        );

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    color: inherit;
}

button:focus-visible,
input:focus-visible {
    outline: 3px solid rgba(75,151,194,.32);
    outline-offset: 2px;
}

/* Верхняя панель */

.topbar {
    width: min(1220px, calc(100% - 30px));
    height: 58px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.04em;
}

.brand-mark {
    width: 32px;
    height: 32px;
    padding: 7px;

    display: flex;
    align-items: end;
    justify-content: center;
    gap: 2px;

    border-radius: 9px;
    background: var(--card-dark);
    box-shadow: 0 8px 20px rgba(21,54,65,.2);
}

.brand-mark i {
    width: 3px;
    border-radius: 4px;

    background:
        linear-gradient(
            180deg,
            #a9d7c7,
            var(--blue-light)
        );
}

.brand-mark i:nth-child(1) { height: 7px; }
.brand-mark i:nth-child(2) { height: 14px; }
.brand-mark i:nth-child(3) { height: 10px; }
.brand-mark i:nth-child(4) { height: 18px; }

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--text-soft);
    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8c9b9d;
}

.status.online .status-dot {
    background: var(--green);
    box-shadow:
        0 0 0 5px rgba(94,168,140,.11),
        0 0 15px rgba(94,168,140,.35);
}

.status.error .status-dot {
    background: var(--red);
}

/* Основная область */

main {
    width: min(1220px, calc(100% - 30px));
    margin: auto;
}

.heading {
    min-height: 92px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.heading-label {
    margin: 0 0 4px;

    color: #417c90;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .18em;
}

h1 {
    margin: 0;

    color: #193f42;
    font-size: clamp(34px, 5vw, 50px);
    line-height: .95;
    letter-spacing: -.065em;
}

.heading-description {
    margin: 8px 0 0;

    color: var(--text-soft);
    font-size: 12px;
}

.stream-counter {
    min-width: 106px;
    padding: 11px 15px;

    text-align: right;

    border: 1px solid var(--surface-border);
    border-radius: 14px;

    background: rgba(255,255,255,.65);
    box-shadow: var(--shadow);
}

.stream-counter strong {
    display: block;

    color: #2a6472;
    font-size: 29px;
    line-height: 1;
    letter-spacing: -.07em;
}

.stream-counter span {
    color: var(--text-soft);
    font-size: 10px;
}

/* Поиск и сортировка */

.toolbar {
    margin: 4px 0 11px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.search {
    width: min(520px, 100%);
    height: 40px;
    padding: 0 12px;

    display: flex;
    align-items: center;
    gap: 9px;

    border: 1px solid var(--surface-border);
    border-radius: 11px;

    background: rgba(255,255,255,.72);
    box-shadow: 0 7px 20px rgba(30,63,70,.06);
}

.search-icon {
    color: #648087;
    font-size: 18px;
}

.search input {
    min-width: 0;
    flex: 1;

    border: 0;
    outline: 0;

    color: var(--text);
    background: transparent;
    font-size: 12px;
}

.search input::placeholder {
    color: #839496;
}

.search kbd {
    min-width: 23px;
    height: 23px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(35,73,82,.12);
    border-radius: 6px;

    color: #6b8184;
    background: rgba(229,237,236,.85);
    font-size: 10px;
}

.toolbar-actions {
    padding: 4px;

    display: flex;
    align-items: center;
    gap: 4px;

    border: 1px solid var(--surface-border);
    border-radius: 11px;

    background: rgba(255,255,255,.72);
}

.toolbar-actions button {
    height: 31px;
    padding: 0 11px;

    border: 0;
    border-radius: 8px;

    color: #405f66;
    background: #cfdddf;

    font-size: 11px;
    font-weight: 650;
    cursor: pointer;
}

.toolbar-actions button:hover {
    color: #173b44;
    background: #becfd4;
}

.toolbar-actions button.active {
    color: white;
    background: #315f71;
}

.toolbar-actions .refresh-button {
    width: 32px;
    padding: 0;
    font-size: 16px;
}

.refresh-button.loading {
    animation: rotate .75s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

/* Потоки */

.stream-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 9px;
}

.stream-card {
    position: relative;
    min-width: 0;
    min-height: 82px;
    padding: 11px 12px 11px 14px;

    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    align-items: center;
    gap: 12px;

    overflow: hidden;

    border: 1px solid var(--card-border);
    border-radius: 14px;

    color: var(--light);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            transparent 60%
        ),
        var(--card);

    box-shadow:
        0 8px 20px rgba(23,55,65,.16),
        inset 0 1px 0 rgba(255,255,255,.035);

    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}

.stream-card:hover {
    transform: translateY(-1px);
    border-color: rgba(125,192,221,.36);
    background: var(--card-hover);
}

.stream-card.active {
    border-color: rgba(125,199,232,.72);

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(96,169,209,.3),
            transparent 42%
        ),
        var(--card-active);
}

.stream-card.active::before {
    content: "";

    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;

    background:
        linear-gradient(
            180deg,
            #7ec5a9,
            #70b8e0
        );
}

.stream-information {
    min-width: 0;
}

.stream-line {
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 8px;
}

.stream-mount {
    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 14px;
    font-weight: 800;
    letter-spacing: -.025em;
}

.listeners {
    flex: 0 0 auto;

    color: #a8c3c8;
    font-size: 9px;
}

.listeners::before {
    content: "";

    width: 5px;
    height: 5px;
    margin-right: 5px;

    display: inline-block;

    border-radius: 50%;
    background: #72c4a4;
}

.stream-track {
    min-width: 0;
    margin-top: 5px;
}

.stream-artist,
.stream-title {
    display: block;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.stream-artist {
    color: #eff9fa;
    font-size: 11px;
    font-weight: 650;
}

.stream-title {
    margin-top: 1px;

    color: #acc6cb;
    font-size: 10px;
}

.stream-title.only-title {
    margin-top: 0;
    color: #d2e1e3;
}

.stream-extra {
    margin-top: 4px;

    color: #829fa5;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.stream-buttons {
    display: flex;
    align-items: center;
    gap: 6px;
}

.stream-buttons button {
    border: 1px solid rgba(255,255,255,.09);
    color: #ecf7f9;
    background: var(--button);
    cursor: pointer;
}

.stream-buttons button:hover {
    border-color: rgba(132,200,231,.42);
    background: var(--button-hover);
}

.history-button {
    width: 32px;
    height: 32px;

    border-radius: 9px;
    font-size: 13px;
}

.play-button {
    width: 42px;
    height: 42px;

    border-radius: 50%;
    font-size: 12px;
}

.empty-state {
    padding: 70px 20px;

    color: var(--text-soft);
    text-align: center;
}

.empty-state strong {
    display: block;
    margin-bottom: 6px;

    color: var(--text);
}

.hidden {
    display: none !important;
}

/* Скелет загрузки */

.skeleton {
    min-height: 82px;

    border-radius: 14px;

    background:
        linear-gradient(
            90deg,
            #d1dcdd 20%,
            #e2e9e8 38%,
            #d1dcdd 58%
        );

    background-size: 200% 100%;
    animation: shimmer 1.2s infinite linear;
}

@keyframes shimmer {
    to { background-position: -200% 0; }
}

/* Нижний плеер */

.player {
    position: fixed;
    z-index: 50;
    left: 10px;
    right: 10px;
    bottom: 8px;

    min-height: 62px;
    padding: 7px 12px;

    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto minmax(190px,.45fr);
    align-items: center;
    gap: 11px;

    color: #f3fafb;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 17px;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(84,145,168,.32),
            transparent 38%
        ),
        linear-gradient(
            110deg,
            rgba(22,55,59,.97),
            rgba(20,45,58,.97)
        );

    backdrop-filter: blur(24px);
    box-shadow: 0 18px 55px rgba(24,51,57,.32);
}

.player-navigation {
    display: flex;
    align-items: center;
    gap: 5px;
}

.player-navigation button,
.player-volume button {
    border: 0;
    color: #edf7f8;
    background: rgba(255,255,255,.09);
    cursor: pointer;
}

.player-navigation button:hover,
.player-volume button:hover {
    background: rgba(255,255,255,.15);
}

.small-control {
    width: 32px;
    height: 32px;
    border-radius: 9px;
}

.master-play {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    color: #15363c !important;
    background:
        linear-gradient(
            135deg,
            #e9f4ef,
            #a8cfe1
        ) !important;

    box-shadow: 0 6px 18px rgba(7,28,34,.22);
}

.now-playing {
    min-width: 0;
}

.now-line {
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 7px;

    color: #aec5c8;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.live-badge {
    color: var(--red);
    font-weight: 900;
}

.current-mount {
    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.current-track {
    min-width: 0;
    margin-top: 3px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 11px;
    font-weight: 650;
}

.equalizer {
    height: 27px;

    display: flex;
    align-items: center;
    gap: 3px;

    opacity: .28;
}

.equalizer i {
    width: 3px;
    height: 5px;

    border-radius: 4px;
    background:
        linear-gradient(
            180deg,
            #8bd0b7,
            #77b8de
        );
}

.player.playing .equalizer {
    opacity: 1;
}

.player.playing .equalizer i {
    animation: bounce .72s ease-in-out infinite alternate;
}

.player.playing .equalizer i:nth-child(2) { animation-delay: -.18s; }
.player.playing .equalizer i:nth-child(3) { animation-delay: -.44s; }
.player.playing .equalizer i:nth-child(4) { animation-delay: -.1s; }
.player.playing .equalizer i:nth-child(5) { animation-delay: -.32s; }
.player.playing .equalizer i:nth-child(6) { animation-delay: -.55s; }

@keyframes bounce {
    from { height: 4px; }
    to { height: 24px; }
}

.player-volume {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
}

.live-time {
    min-width: 39px;

    color: #aec4c7;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
}

.volume-control {
    width: min(130px,15vw);
    accent-color: #79b9dd;
}

/* Модальное окно истории */

.modal {
    position: fixed;
    z-index: 100;
    inset: 0;

    padding: 20px;

    display: grid;
    place-items: center;

    background: rgba(15,38,44,.48);
    backdrop-filter: blur(8px);
}

.modal-panel {
    width: min(680px,100%);
    max-height: min(650px,calc(100vh - 40px));

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.13);
    border-radius: 18px;

    color: #eef8f9;
    background: #193b45;

    box-shadow: 0 25px 90px rgba(12,32,38,.42);
}

.modal-header {
    padding: 14px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;

    border-bottom: 1px solid rgba(255,255,255,.08);
}

.modal-label {
    margin: 0 0 3px;

    color: #8cc5dc;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .16em;
}

.modal-title {
    margin: 0;

    font-size: 18px;
    letter-spacing: -.035em;
}

.modal-close {
    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 9px;

    color: white;
    background: #102d36;
    cursor: pointer;
}

.modal-content {
    max-height: calc(min(650px,100vh - 40px) - 64px);
    padding: 13px 16px 18px;

    overflow-y: auto;
}

.history-section + .history-section {
    margin-top: 20px;
}

.history-section-title {
    margin: 0 0 7px;

    color: #a6cbd2;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
}

.history-list {
    display: grid;
}

.history-row {
    min-width: 0;
    padding: 8px 1px;

    display: grid;
    grid-template-columns: 65px minmax(0,1fr);
    gap: 10px;

    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: 11px;
}

.history-row:last-child {
    border-bottom: 0;
}

.history-time {
    color: #829fa5;
    font-variant-numeric: tabular-nums;
}

.history-track {
    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-empty,
.history-error,
.history-loading {
    padding: 15px 0;

    color: #9bb6bb;
    font-size: 11px;
}

.history-error {
    color: #f0a6af;
}

@media (max-width: 760px) {
    body {
        padding-bottom: 126px;
    }

    .topbar,
    main {
        width: calc(100% - 20px);
    }

    .heading {
        min-height: 86px;
    }

    .stream-counter {
        display: none;
    }

    .toolbar {
        align-items: stretch;
        flex-direction: column;
    }

    .search {
        width: 100%;
    }

    .toolbar-actions {
        width: max-content;
    }

    .stream-grid {
        grid-template-columns: 1fr;
    }

    .stream-card {
        min-height: 84px;
    }

    .player {
        grid-template-columns: auto minmax(0,1fr);
        gap: 7px 10px;
    }

    .equalizer {
        display: none;
    }

    .player-volume {
        grid-column: 2;
        justify-content: space-between;
    }

    .volume-control {
        width: 45vw;
    }
}

@media (max-width: 430px) {
    .status-text {
        display: none;
    }

    h1 {
        font-size: 38px;
    }

    .heading-description {
        font-size: 11px;
    }

    .stream-card {
        padding-left: 12px;
    }

    .stream-buttons {
        gap: 4px;
    }

    .history-button {
        width: 30px;
        height: 30px;
    }

    .play-button {
        width: 39px;
        height: 39px;
    }
}
</style>

            ),

        <span>Попробуйте другой запрос.</span>
    </section>
</main>

        </button>

    <div class="now-playing">
        <div class="now-line">

            <span
                class="current-mount"

            </span>

        >
            —
        </div>

            🔊
        </button>

<div
    class="modal hidden"
    id="historyModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="historyModalTitle"
>
    <div class="modal-panel">
        <header class="modal-header">
            <div>
                <p class="modal-label">TRACK HISTORY</p>
                <h2
                    class="modal-title"
                    id="historyModalTitle"
                >
                    История
                </h2>
            </div>

            <button
                class="modal-close"
                id="historyCloseButton"
                type="button"
                aria-label="Закрыть"

        <div

<audio id="audio" preload="none"></audio>

<script>
(() => {
    "use strict";

    const HEALTH_API = "/api/deepbeat-health";
    const HISTORY_API = "/api/deepbeat-history";
    const STREAM_ORIGIN = "https://stream.deepbeat.ru:8443";

    const REFRESH_INTERVAL = 20000;
    const MAX_LOCAL_HISTORY = 100;

    const state = {
        streams: [],
        currentMount: null,
        query: "",
        sort: "name",
        startedAt: 0,
        updateTimer: null,
        liveTimer: null,
        historyMount: null,
        localHistory: loadLocalHistory()
    };

    const dom = {
        audio: document.getElementById("audio"),
        status: document.getElementById("status"),
        statusText: document.getElementById("statusText"),
        streamCount: document.getElementById("streamCount"),
        streamGrid: document.getElementById("streamGrid"),
        emptyState: document.getElementById("emptyState"),
        searchInput: document.getElementById("searchInput"),
        sortButtons: [
            ...document.querySelectorAll(".sort-button")
        ],
        refreshButton:
            document.getElementById("refreshButton"),
        player: document.getElementById("player"),
        previousButton:
            document.getElementById("previousButton"),
        masterPlayButton:
            document.getElementById("masterPlayButton"),
        nextButton:
            document.getElementById("nextButton"),
        currentMount:
            document.getElementById("currentMount"),
        currentTrack:
            document.getElementById("currentTrack"),
        liveTime:
            document.getElementById("liveTime"),
        muteButton:
            document.getElementById("muteButton"),
        volumeControl:
            document.getElementById("volumeControl"),
        historyModal:
            document.getElementById("historyModal"),
        historyModalTitle:
            document.getElementById("historyModalTitle"),
        historyModalContent:
            document.getElementById("historyModalContent"),
        historyCloseButton:
            document.getElementById("historyCloseButton")
    };

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function normalizeMount(value) {
        const mount = String(value || "").trim();

        if (!mount) {
            return "";
        }

        return mount.startsWith("/")
            ? mount
            : "/" + mount;
    }

    function parseTrack(value) {
        const raw = String(value || "").trim();

        if (!raw || raw === "-") {
            return {
                raw: "",
                artist: "",
                title: ""
            };
        }

        for (const separator of [" — ", " – ", " - "]) {
            const index = raw.indexOf(separator);

            if (index > 0) {
                return {
                    raw,
                    artist: raw.slice(0, index).trim(),
                    title: raw
                        .slice(index + separator.length)
                        .trim()
                };
            }
        }

        return {
            raw,
            artist: "",
            title: raw
        };
    }

    function mapHealthResponse(data) {
        const mounts = data?.mounts;

        if (!mounts || typeof mounts !== "object") {
            return [];
        }

        return Object.entries(mounts)
            .filter(([mount, information]) => {
                if (
                    !mount ||
                    !information ||
                    typeof information !== "object"
                ) {
                    return false;
                }

                return String(information.status || "")
                    .trim()
                    .toLowerCase() !== "stopped";
            })
            .map(([mount, information]) => {
                const normalizedMount = normalizeMount(mount);

                const nowPlaying =
                    typeof information.metadata?.now_playing
                        === "string"
                        ? information.metadata.now_playing.trim()
                        : "";

                const listeners =
                    Number(information.listener_count);

                const bitrate =
                    Number(information.format?.bitrate);

                return {
                    mount: normalizedMount,
                    url: STREAM_ORIGIN + normalizedMount,
                    rawTitle: nowPlaying,
                    track: parseTrack(nowPlaying),

                    listeners:
                        Number.isFinite(listeners)
                            ? listeners
                            : 0,

                    bitrate:
                        Number.isFinite(bitrate)
                            ? bitrate
                            : null,

                    contentType:
                        information.format?.content_type ||
                        "audio/mpeg",

                    status:
                        String(information.status || "Active")
                };
            });
    }

    function currentStream() {
        return state.streams.find(
            stream => stream.mount === state.currentMount
        ) || null;
    }

    function visibleStreams() {
        const query = state.query
            .trim()
            .toLocaleLowerCase("ru");

        const result = state.streams.filter(stream => {
            if (!query) {
                return true;
            }

            const searchable = [
                stream.mount,
                stream.rawTitle,
                stream.track.artist,
                stream.track.title
            ]
                .join(" ")
                .toLocaleLowerCase("ru");

            return searchable.includes(query);
        });

        result.sort((first, second) => {
            if (state.sort === "listeners") {
                return (
                    second.listeners - first.listeners ||
                    first.mount.localeCompare(
                        second.mount,
                        "ru",
                        {sensitivity: "base"}
                    )
                );
            }

            return first.mount.localeCompare(
                second.mount,
                "ru",
                {sensitivity: "base"}
            );
        });

        return result;
    }

    function trackMarkup(stream) {
        if (!stream.rawTitle) {
            return `
                <div class="stream-track">
                    <span class="stream-title only-title">
                        Метаданные композиции отсутствуют
                    </span>
                </div>
            `;
        }

        if (!stream.track.artist) {
            return `
                <div
                    class="stream-track"
                    title="${escapeHtml(stream.rawTitle)}"
                >
                    <span class="stream-title only-title">
                        ${escapeHtml(stream.track.title)}
                    </span>
                </div>
            `;
        }

        return `
            <div
                class="stream-track"
                title="${escapeHtml(stream.rawTitle)}"
            >
                <span class="stream-artist">
                    ${escapeHtml(stream.track.artist)}
                </span>

                <span class="stream-title">
                    ${escapeHtml(stream.track.title)}
                </span>
            </div>
        `;
    }

    function renderStreams() {
        const streams = visibleStreams();

        dom.emptyState.classList.toggle(
            "hidden",
            streams.length > 0
        );

        dom.streamGrid.innerHTML = streams
            .map(stream => {
                const active =
                    stream.mount === state.currentMount;

                const playing =
                    active && !dom.audio.paused;

                const extra = [
                    stream.bitrate
                        ? stream.bitrate + " kbps"
                        : "",
                    stream.contentType
                        ? stream.contentType
                              .replace("audio/", "")
                              .toUpperCase()
                        : ""
                ]
                    .filter(Boolean)
                    .join(" · ");

                return `
                    <article
                        class="stream-card${
                            active ? " active" : ""
                        }"
                        data-card-mount="${
                            escapeHtml(stream.mount)
                        }"
                    >
                        <div class="stream-information">
                            <div class="stream-line">
                                <span class="stream-mount">
                                    ${escapeHtml(stream.mount)}
                                </span>

                                <span class="listeners">
                                    ${stream.listeners}
                                </span>
                            </div>

                            ${trackMarkup(stream)}

                            ${
                                extra
                                    ? `
                                        <div class="stream-extra">
                                            ${escapeHtml(extra)}
                                        </div>
                                      `
                                    : ""
                            }
                        </div>

                        <div class="stream-buttons">
                            <button
                                class="history-button"
                                type="button"
                                data-action="history"
                                data-mount="${
                                    escapeHtml(stream.mount)
                                }"
                                title="История треков"
                            >
                                <span class="action-icon">◷</span>
                                <span class="action-label">История</span>
                            </button>

                            <button
                                class="play-button"
                                type="button"
                                data-action="play"
                                data-mount="${
                                    escapeHtml(stream.mount)
                                }"
                                title="${
                                    playing
                                        ? "Пауза"
                                        : "Воспроизвести"
                                }"
                            >
                                <span class="action-icon">
                                    ${playing ? "❚❚" : "▶"}
                                </span>

                                <span class="action-label">
                                    ${playing ? "Пауза" : "Слушать"}
                                </span>
                            </button>
                        </div>
                    </article>
                `;
            })
            .join("");
    }

    function updateCurrentDisplay() {
        const stream = currentStream();

        if (!stream) {
            dom.currentMount.textContent = "эфир не запущен";
            dom.currentTrack.textContent = "—";
            return;
        }

        dom.currentMount.textContent = stream.mount;

        dom.currentTrack.textContent =
            stream.rawTitle || "Прямой эфир";

        if ("mediaSession" in navigator) {
            try {
                navigator.mediaSession.metadata =
                    new MediaMetadata({
                        title:
                            stream.track.title ||
                            stream.rawTitle ||
                            "Прямой эфир",

                        artist:
                            stream.track.artist ||
                            "mstream",

                        album:
                            stream.mount
                    });
            } catch (error) {
                console.warn(error);
            }
        }
    }

    function setStatus(type, text) {
        dom.status.className = "status";

        if (type) {
            dom.status.classList.add(type);
        }

        dom.statusText.textContent = text;
    }

    async function refreshStreams(manual = false) {
        if (manual) {
            dom.refreshButton.classList.add("loading");
        }

        const previousCurrent = currentStream();
        const previousTitle =
            previousCurrent?.rawTitle || "";

        try {
            const response = await fetch(
                HEALTH_API + "?time=" + Date.now(),
                {
                    cache: "no-store",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const data = await response.json();
            const streams = mapHealthResponse(data);

            if (!streams.length) {
                throw new Error(
                    "Нет активных потоков"
                );
            }

            state.streams = streams;

            if (
                state.currentMount &&
                !currentStream()
            ) {
                dom.audio.pause();
                dom.audio.removeAttribute("src");
                dom.audio.load();

                state.currentMount = null;
            }

            const updatedCurrent = currentStream();

            if (
                updatedCurrent &&
                !dom.audio.paused &&
                updatedCurrent.rawTitle &&
                updatedCurrent.rawTitle !== previousTitle
            ) {
                addLocalHistory(updatedCurrent);
            }

            if (dom.streamCount) {
                dom.streamCount.textContent =
                    String(streams.length);
            }

            setStatus(
                "online",
                streams.length + " потоков в эфире"
            );

            updateCurrentDisplay();
            renderStreams();
        } catch (error) {
            console.error(error);

            setStatus(
                "error",
                "ошибка получения потоков"
            );

            if (!state.streams.length) {
                dom.streamGrid.innerHTML = "";
                dom.emptyState.classList.remove("hidden");
                dom.emptyState.innerHTML =
                    "<strong>Потоки недоступны</strong>" +
                    "<span>Не удалось получить данные сервера.</span>";
            }
        } finally {
            dom.refreshButton.classList.remove("loading");
        }
    }

    async function selectStream(mount) {
        const stream = state.streams.find(
            item => item.mount === mount
        );

        if (!stream) {
            return;
        }

        if (state.currentMount === mount) {
            if (dom.audio.paused) {
                await playCurrent();
            } else {
                dom.audio.pause();
            }

            return;
        }

        state.currentMount = stream.mount;
        state.startedAt = 0;

        dom.audio.src = stream.url;
        dom.audio.load();

        updateCurrentDisplay();
        renderStreams();

        await playCurrent();
    }

    async function playCurrent() {
        const stream = currentStream();

        if (!stream) {
            const first = visibleStreams()[0];

            if (first) {
                await selectStream(first.mount);
            }

            return;
        }

        try {
            await dom.audio.play();
            addLocalHistory(stream);
        } catch (error) {
            console.error(error);

            dom.currentTrack.textContent =
                "Не удалось запустить поток";
        }
    }

    function adjacentStream(direction) {
        const streams = visibleStreams().length
            ? visibleStreams()
            : state.streams;

        if (!streams.length) {
            return null;
        }

        const currentIndex = streams.findIndex(
            stream => stream.mount === state.currentMount
        );

        if (currentIndex === -1) {
            return streams[0];
        }

        const nextIndex =
            (
                currentIndex +
                direction +
                streams.length
            ) % streams.length;

        return streams[nextIndex];
    }

    async function playAdjacent(direction) {
        const stream = adjacentStream(direction);

        if (stream) {
            await selectStream(stream.mount);
        }
    }

    function updatePlaybackInterface() {
        const playing = !dom.audio.paused;

        dom.player.classList.toggle(
            "playing",
            playing
        );

        dom.masterPlayButton.textContent =
            playing ? "❚❚" : "▶";

        if (playing && !state.startedAt) {
            state.startedAt = Date.now();
        }

        if (!playing) {
            state.startedAt = 0;
            dom.liveTime.textContent = "0:00";
        }

        updateCurrentDisplay();
        renderStreams();
    }

    function loadLocalHistory() {
        try {
            const value = JSON.parse(
                localStorage.getItem(
                    "mstream-listened-history"
                ) || "[]"
            );

            return Array.isArray(value)
                ? value.slice(0, MAX_LOCAL_HISTORY)
                : [];
        } catch {
            return [];
        }
    }

    function addLocalHistory(stream) {
        if (
            !stream ||
            !stream.rawTitle ||
            state.currentMount !== stream.mount ||
            dom.audio.paused
        ) {
            return;
        }

        const latest = state.localHistory[0];

        if (
            latest &&
            latest.mount === stream.mount &&
            latest.rawTitle === stream.rawTitle
        ) {
            return;
        }

        state.localHistory.unshift({
            mount: stream.mount,
            rawTitle: stream.rawTitle,
            artist: stream.track.artist,
            title: stream.track.title,
            date: new Date().toISOString()
        });

        state.localHistory =
            state.localHistory.slice(
                0,
                MAX_LOCAL_HISTORY
            );

        localStorage.setItem(
            "mstream-listened-history",
            JSON.stringify(state.localHistory)
        );
    }

    function historyTime(value) {
        if (!value) {
            return "—";
        }

        if (
            typeof value === "string" &&
            /^\d{1,2}:\d{2}/.test(value)
        ) {
            return value.slice(0, 5);
        }

        let date;

        if (typeof value === "number") {
            date = new Date(
                value > 1000000000000
                    ? value
                    : value * 1000
            );
        } else {
            date = new Date(value);
        }

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleTimeString(
            "ru-RU",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }

    function normalizeHistoryItem(item) {
        if (typeof item === "string") {
            return {
                title: item,
                time: ""
            };
        }

        if (!item || typeof item !== "object") {
            return null;
        }

        const title =
            item.now_playing ||
            item.title ||
            item.song ||
            item.track ||
            item.metadata?.now_playing ||
            item.metadata?.title ||
            "";

        const time =
            item.timestamp ||
            item.time ||
            item.played_at ||
            item.created_at ||
            item.updated_at ||
            item.date ||
            "";

        if (!title) {
            return null;
        }

        return {
            title: String(title),
            time
        };
    }

    function extractServerHistory(payload, mount) {
        const roots = [
            payload?.mounts,
            payload?.history,
            payload
        ];

        const mountWithoutSlash =
            mount.replace(/^\//, "");

        for (const root of roots) {
            if (!root) {
                continue;
            }

            if (Array.isArray(root)) {
                const normalized = root
                    .map(normalizeHistoryItem)
                    .filter(Boolean);

                if (normalized.length) {
                    return normalized;
                }
            }

            if (typeof root !== "object") {
                continue;
            }

            let value =
                root[mount] ??
                root[mountWithoutSlash];

            if (!value) {
                continue;
            }

            if (Array.isArray(value)) {
                return value
                    .map(normalizeHistoryItem)
                    .filter(Boolean);
            }

            if (typeof value === "object") {
                for (
                    const key of [
                        "history",
                        "tracks",
                        "items",
                        "metadata"
                    ]
                ) {
                    if (Array.isArray(value[key])) {
                        return value[key]
                            .map(normalizeHistoryItem)
                            .filter(Boolean);
                    }
                }
            }
        }

        return [];
    }

    async function fetchServerHistory(mount) {
        const requests = [
            HISTORY_API + "?time=" + Date.now(),

            HISTORY_API +
                "?mount=" +
                encodeURIComponent(mount) +
                "&time=" +
                Date.now()
        ];

        for (const url of requests) {
            try {
                const response = await fetch(
                    url,
                    {
                        cache: "no-store",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (!response.ok) {
                    continue;
                }

                const payload = await response.json();
                const history =
                    extractServerHistory(
                        payload,
                        mount
                    );

                if (history.length) {
                    return history;
                }
            } catch (error) {
                console.warn(error);
            }
        }

        return [];
    }

    function historyRows(items) {
        return items.map(item => {
            const track =
                parseTrack(item.title || "");

            const title = track.artist
                ? track.artist + " — " + track.title
                : track.title || item.title;

            return `
                <div class="history-row">
                    <span class="history-time">
                        ${escapeHtml(
                            historyTime(item.time)
                        )}
                    </span>

                    <span
                        class="history-track"
                        title="${escapeHtml(title)}"
                    >
                        ${escapeHtml(title)}
                    </span>
                </div>
            `;
        }).join("");
    }

    async function openHistory(mount) {
        state.historyMount = mount;

        dom.historyModalTitle.textContent =
            "История " + mount;

        dom.historyModalContent.innerHTML =
            '<div class="history-loading">' +
            'Загрузка истории…' +
            '</div>';

        dom.historyModal.classList.remove("hidden");
        document.body.style.overflow = "hidden";

        const serverHistory =
            await fetchServerHistory(mount);

        const localHistory = state.localHistory
            .filter(item => item.mount === mount)
            .map(item => ({
                title: item.rawTitle,
                time: item.date
            }));

        dom.historyModalContent.innerHTML = `
            <section class="history-section">
                <h3 class="history-section-title">
                    История эфира
                </h3>

                <div class="history-list">
                    ${
                        serverHistory.length
                            ? historyRows(
                                serverHistory.slice(0, 50)
                              )
                            : '<div class="history-empty">' +
                              'Сервер не вернул историю ' +
                              'для этого потока.' +
                              '</div>'
                    }
                </div>
            </section>

            <section class="history-section">
                <h3 class="history-section-title">
                    Прослушано на этом устройстве
                </h3>

                <div class="history-list">
                    ${
                        localHistory.length
                            ? historyRows(
                                localHistory.slice(0, 50)
                              )
                            : '<div class="history-empty">' +
                              'На этом устройстве пока ничего ' +
                              'не прослушано.' +
                              '</div>'
                    }
                </div>
            </section>
        `;
    }

    function closeHistory() {
        dom.historyModal.classList.add("hidden");
        document.body.style.overflow = "";
        state.historyMount = null;
    }

    dom.streamGrid.addEventListener(
        "click",
        event => {
            const button =
                event.target.closest("[data-action]");

            if (!button) {
                return;
            }

            const mount = button.dataset.mount;

            if (button.dataset.action === "play") {
                selectStream(mount);
            }

            if (button.dataset.action === "history") {
                openHistory(mount);
            }
        }
    );

    dom.searchInput.addEventListener(
        "input",
        () => {
            state.query = dom.searchInput.value;
            renderStreams();
        }
    );

    dom.sortButtons.forEach(button => {
        button.addEventListener(
            "click",
            () => {
                state.sort = button.dataset.sort;

                dom.sortButtons.forEach(item => {
                    item.classList.toggle(
                        "active",
                        item === button
                    );
                });

                renderStreams();
            }
        );
    });

    dom.refreshButton.addEventListener(
        "click",
        () => refreshStreams(true)
    );

    dom.masterPlayButton.addEventListener(
        "click",
        async () => {
            if (dom.audio.paused) {
                await playCurrent();
            } else {
                dom.audio.pause();
            }
        }
    );

    dom.previousButton.addEventListener(
        "click",
        () => playAdjacent(-1)
    );

    dom.nextButton.addEventListener(
        "click",
        () => playAdjacent(1)
    );

    dom.volumeControl.addEventListener(
        "input",
        () => {
            const value =
                Number(dom.volumeControl.value);

            dom.audio.volume = value;
            dom.audio.muted = false;

            localStorage.setItem(
                "mstream-volume",
                String(value)
            );

            dom.muteButton.textContent =
                value === 0 ? "🔇" : "🔊";
        }
    );

    dom.muteButton.addEventListener(
        "click",
        () => {
            dom.audio.muted = !dom.audio.muted;

            dom.muteButton.textContent =
                dom.audio.muted ? "🔇" : "🔊";
        }
    );

    dom.audio.addEventListener(
        "play",
        updatePlaybackInterface
    );

    dom.audio.addEventListener(
        "playing",
        () => {
            updatePlaybackInterface();

            const stream = currentStream();

            if (stream) {
                addLocalHistory(stream);
            }
        }
    );

    dom.audio.addEventListener(
        "pause",
        updatePlaybackInterface
    );

    dom.audio.addEventListener(
        "waiting",
        () => {
            dom.currentTrack.textContent =
                "Буферизация…";
        }
    );

    dom.audio.addEventListener(
        "error",
        () => {
            dom.player.classList.remove("playing");
            dom.currentTrack.textContent =
                "Поток недоступен";
            renderStreams();
        }
    );

    dom.historyCloseButton.addEventListener(
        "click",
        closeHistory
    );

    dom.historyModal.addEventListener(
        "click",
        event => {
            if (event.target === dom.historyModal) {
                closeHistory();
            }
        }
    );

    document.addEventListener(
        "keydown",
        event => {
            const typing =
                event.target instanceof HTMLInputElement ||
                event.target instanceof HTMLTextAreaElement;

            if (
                event.key === "/" &&
                !typing
            ) {
                event.preventDefault();
                dom.searchInput.focus();
                return;
            }

            if (event.key === "Escape") {
                if (
                    !dom.historyModal.classList
                        .contains("hidden")
                ) {
                    closeHistory();
                } else {
                    dom.searchInput.blur();
                }

                return;
            }

            if (
                event.code === "Space" &&
                !typing
            ) {
                event.preventDefault();

                if (dom.audio.paused) {
                    playCurrent();
                } else {
                    dom.audio.pause();
                }

                return;
            }

            if (
                event.key === "ArrowLeft" &&
                !typing
            ) {
                playAdjacent(-1);
            }

            if (
                event.key === "ArrowRight" &&
                !typing
            ) {
                playAdjacent(1);
            }
        }
    );

    if ("mediaSession" in navigator) {
        try {
            navigator.mediaSession.setActionHandler(
                "play",
                playCurrent
            );

            navigator.mediaSession.setActionHandler(
                "pause",
                () => dom.audio.pause()
            );

            navigator.mediaSession.setActionHandler(
                "previoustrack",
                () => playAdjacent(-1)
            );

            navigator.mediaSession.setActionHandler(
                "nexttrack",
                () => playAdjacent(1)
            );
        } catch (error) {
            console.warn(error);
        }
    }

    const savedVolume = Number(
        localStorage.getItem("mstream-volume")
    );

    if (
        Number.isFinite(savedVolume) &&
        savedVolume >= 0 &&
        savedVolume <= 1
    ) {
        dom.volumeControl.value =
            String(savedVolume);

        dom.audio.volume = savedVolume;
    } else {
        dom.audio.volume =
            Number(dom.volumeControl.value);
    }

    state.liveTimer = setInterval(
        () => {
            if (
                !state.startedAt ||
                dom.audio.paused
            ) {
                return;
            }

            const seconds = Math.floor(
                (Date.now() - state.startedAt) / 1000
            );

            dom.liveTime.textContent =
                Math.floor(seconds / 60) +
                ":" +
                String(seconds % 60).padStart(2, "0");
        },
        1000
    );

    refreshStreams();

    state.updateTimer = setInterval(
        refreshStreams,
        REFRESH_INTERVAL
    );
})();
</script>

</body>
</html>

.stream-artist {
    color: #58a883 !important;
}
